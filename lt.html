function doPlayCard(d,targetIdx){
  const b=G.battle;if(!b||b.over)return;const h=d.hand;const hIdx=b.hand.indexOf(h);if(hIdx<0)return;if(h.entangled)return;const actualCost=Math.max(0,(h.tempCost!==null?h.tempCost:CARDS[h.id].cost)-(b.costReduce||0));if(b.energy<actualCost)return;
  let targetEl=null;if(targetIdx>=0)targetEl=document.querySelector(`[data-enemy-idx="${targetIdx}"]`);else targetEl=document.querySelector('[data-player-drop]');const rect=targetEl?targetEl.getBoundingClientRect():null;
  b.energy-=actualCost;b.hand.splice(hIdx,1);b.cardsPlayedThisTurn++;
  if(b.echoEnergy>0){b.energy+=1;b.echoEnergy--;addLog('灵力回响：+1 能量','#c080ff');}const card=CARDS[h.id];
  if(card.countdown)scheduleCountdown(h.id,card,b,targetIdx);if(!card.exhaust&&!card.countdown)b.discardPile.push(h.id);
  /* 复仇打击累计 */
  if(card.revengeCard){
    b.revengeCount=(b.revengeCount||0)+1;
    if(b.revengeCount>=2){b.discardPile.push(h.id);b.revengeCount=0;addLog(`复仇打击累计2次，复制一张到弃牌堆`,'#ff6060');}
    else addLog(`复仇打击计数 ${b.revengeCount}/2`,'#ff8080');
  }
  /* 魔术 */
  if(b.magic){b.magicCount[h.id]=(b.magicCount[h.id]||0)+1;if(b.magicCount[h.id]%2===0){if(b.hand.length<HAND_LIMIT){const newH={uid:uid++,id:h.id,tempCost:0,entangled:false};b.hand.push(newH);b.newDrawUids.push(newH.uid);}else{showWarnAnim('手牌上限已满，魔术复制被弃置');}addLog(`魔术：复制了一张【${card.name}】（0费）`,'#c080ff');}}
  if(card.type==='attack')b.attackPlayedThisTurn=true;
  if(card.hpLoss){G.hp-=card.hpLoss;if(rect)floatText(rect,'-'+card.hpLoss+' HP','#ff6060');}
  const clone=d.clone;if(rect&&clone){clone.style.transition='all 220ms cubic-bezier(.4,0,.7,1)';clone.style.left=(rect.left+rect.width/2-48)+'px';clone.style.top=(rect.top+rect.height/2-66)+'px';clone.style.transform='scale(0.45) rotate(12deg)';clone.style.opacity='0';setTimeout(()=>clone.remove(),240);}
  const targetName=targetIdx>=0&&b.enemies[targetIdx]?b.enemies[targetIdx].name:(card.aoe?'全体敌人':'自己');
  if(card.type==='attack'){const pr=document.querySelector('.playerrow');if(pr){pr.classList.add('hero-atk');setTimeout(()=>pr.classList.remove('hero-atk'),300);}}
  if(card.hp||card.type==='heal'){const pr=document.querySelector('.playerrow');if(pr){pr.classList.add('heal-flash');setTimeout(()=>pr.classList.remove('heal-flash'),450);}}
  if(card.sh||card.type==='defend'){const pr=document.querySelector('.playerrow');if(pr){pr.classList.add('shield-flash');setTimeout(()=>pr.classList.remove('shield-flash'),450);}}
  const sameNameCount=countSameInHand(h,-1);const handCount=b.hand.length;const skillCardCount=b.hand.filter(x=>CARDS[x.id].type==='defend'||CARDS[x.id].type==='buff'||CARDS[x.id].type==='draw').length;const attackInHand=b.hand.filter(x=>CARDS[x.id].type==='attack').length;
  const defendInHand=b.hand.filter(x=>CARDS[x.id].type==='defend').length;
  const discardCount=b.discardPile.length;

  if(card.countdown){
    /* 倒计时卡：效果延后，这里什么都不做 */
  }
  else if(card.type==='attack'){
    /* 弃牌堆特殊攻击 */
    if(card.special==='discardStorm'||card.special==='discardStorm2'){
      const div=card.special==='discardStorm2'?2:3;
      let total=Math.max(1,Math.floor(discardCount/div));
      if(b.playerWeakness>0)total=Math.max(0,total-b.playerWeakness);
      addLog(`弃牌风暴：弃牌堆 ${discardCount} 张，对全体造成 ${total} 伤害`,'#ff8080');
      for(const e of b.enemies){const absorbed=Math.min(e.shield,total);e.shield-=absorbed;e.hp-=(total-absorbed);}
      if(rect)floatText(rect,'全体-'+total,'#ff6060');
    }
    else if(card.special==='discardImpact'||card.special==='discardImpact2'){
      let perHit=card.special==='discardImpact2'?Math.max(5,discardCount):Math.max(3,Math.floor(discardCount/2));
      if(b.rageBonus)perHit+=b.rageBonus;if(b.atkBuff)perHit+=b.atkBuff;
      if(b.playerWeakness>0)perHit=Math.max(0,perHit-b.playerWeakness);
      const e=b.enemies[targetIdx];
      if(e){const absorbed=Math.min(e.shield,perHit);e.shield-=absorbed;e.hp-=(perHit-absorbed);if(rect)floatText(rect,'-'+perHit,'#ff8080');addLog(`弃牌冲击：弃牌堆 ${discardCount} 张，造成 ${perHit} 伤害`,'#ff9090');}
    }
    else if(card.special==='undeadReturn'){
      const took=takeFromDiscardByType('attack');
      if(took){addCardToHand(took);addLog(`亡者归来：取回【${CARDS[took].name}】`,'#8ab8ff');}else{addLog('亡者归来：弃牌堆无攻击牌','#8a8a9a');}
      let perHit=card.dmg||0;
      if(b.rageBonus)perHit+=b.rageBonus;if(b.atkBuff)perHit+=b.atkBuff;
      if(b.playerWeakness>0)perHit=Math.max(0,perHit-b.playerWeakness);
      const e=b.enemies[targetIdx];
      if(e){const absorbed=Math.min(e.shield,perHit);e.shield-=absorbed;e.hp-=(perHit-absorbed);if(rect)floatText(rect,'-'+perHit,'#ff8080');addLog(`对 ${e.name} 造成 ${perHit} 伤害`,'#ff9090');}
    }
    else if(card.special==='discardBlade'||card.special==='discardBlade2'){
      let atkInDiscard=0;for(const id of b.discardPile){if(CARDS[id].type==='attack')atkInDiscard++;}
      let perHit=card.special==='discardBlade2'?(5+atkInDiscard*2):(3+atkInDiscard);
      if(b.rageBonus)perHit+=b.rageBonus;if(b.atkBuff)perHit+=b.atkBuff;
      if(b.playerWeakness>0)perHit=Math.max(0,perHit-b.playerWeakness);
      const e=b.enemies[targetIdx];
      if(e){const absorbed=Math.min(e.shield,perHit);e.shield-=absorbed;e.hp-=(perHit-absorbed);if(rect)floatText(rect,'-'+perHit,'#ff8080');addLog(`弃牌之刃：弃牌堆攻击牌 ${atkInDiscard} 张，造成 ${perHit} 伤害`,'#ff9090');}
    }
    else{
      const targets=card.aoe?b.enemies.filter(x=>x&&x.hp>0):[b.enemies[targetIdx]].filter(Boolean);
      for(const e of targets){
        if(!e)continue;let times=card.hits||1;if(b.doubleNext){times*=2;b.doubleNext=false;}
        let perHit=card.dmg||0;
        if(card.special==='energyBurst')perHit=b.energy*3;
        else if(card.special==='energyBurst2')perHit=b.energy*5;
        else if(card.special==='goldDamage')perHit=Math.floor(G.gold/10);
        else if(card.special==='goldDamage2')perHit=Math.floor(G.gold/8);
        else if(card.special==='shield')perHit=b.shield;
        else if(card.special==='shieldPlus3')perHit=b.shield+3;
        else if(card.special==='shieldPlus5')perHit=b.shield+5;
        else if(card.special==='lostHpHalf')perHit=Math.floor((G.maxHp-G.hp)/2);
        else if(card.special==='lostHpFull')perHit=G.maxHp-G.hp;
        else if(card.special==='echo'&&b.attackPlayedThisTurn)perHit*=2;
        else if(card.special==='goldBurst'){const spend=Math.min(5,G.gold);G.gold-=spend;perHit=spend>0?10:0;}
        else if(card.special==='goldBurst2'){const spend=Math.min(5,G.gold);G.gold-=spend;perHit=spend>0?15:0;}
        else if(card.special==='gamble')perHit=Math.random()<0.5?12:3;
        else if(card.special==='lifeForDamage'){const lost=Math.floor(G.hp/2);G.hp-=lost;perHit=lost;}
        else if(card.special==='poisonHarvest'){perHit=(e.poison||0)*3;e.poison=0;}
        else if(card.special==='poisonHarvest2'){perHit=(e.poison||0)*4;e.poison=0;}
        else if(card.special==='chaos'){const cnt=1+rnd(3);perHit=cnt*4;}
        else if(card.special==='chaos2'){const cnt=1+rnd(3);perHit=cnt*6;}
        else if(card.special==='revengeFlame')perHit=3+Math.floor((G.maxHp-G.hp)/5);
        else if(card.special==='revengeFlame2')perHit=5+Math.floor((G.maxHp-G.hp)/5);
        else if(card.special==='thousandBlades')perHit=b.hand.length;
        else if(card.special==='twinStar'){perHit=6+(Math.random()<0.5?6:0);}
        else if(card.special==='twinStar2'){perHit=8+(Math.random()<0.5?8:0);}
        else if(card.special==='lifeDrain'){G.hp-=3;perHit=8;}
        else if(card.special==='lifeDrain2'){G.hp-=3;perHit=12;}
        else if(card.special==='thornBurst')perHit=b.shield*2;
        else if(card.special==='resonance')perHit=b.cardsPlayedThisTurn;
        else if(card.special==='delayedDoom'||card.special==='delayedDoom2'){b.pendingDoom=card.special==='delayedDoom2'?2:3;addLog(`末日预言将在 ${b.pendingDoom} 回合后降临`,'#ff6060');continue;}
        if(b.rageBonus)perHit+=b.rageBonus;if(b.atkBuff)perHit+=b.atkBuff;
        if(card.sameNameBonus)perHit+=sameNameCount*card.sameNameBonus;
        if(card.perAttackBonus)perHit+=b.cardsPlayedThisTurn*card.perAttackBonus;
        if(card.perCardBonus)perHit+=b.cardsPlayedThisTurn*card.perCardBonus;
        if(card.perHandBonus)perHit+=handCount*card.perHandBonus;
        if(card.perAttackInHand)perHit+=attackInHand*card.perAttackInHand;
        if(card.multiEnemyBonus&&b.enemies.length>1)perHit+=card.multiEnemyBonus*(b.enemies.length-1);
        if(card.debuffBonus&&(e.poison>0||e.weakness>0))perHit+=card.debuffBonus;
        if(card.ifSingleEnemy&&b.enemies.length===1)perHit=card.ifSingleEnemy;
        if(card.emptyHandBonus&&handCount===0)perHit=card.emptyHandBonus;
        if(card.special==='allIn'||card.special==='allIn2'){const dmgPer=card.special==='allIn2'?5:3;const cnt=b.hand.length;while(b.hand.length>0){const h2=b.hand.pop();b.discardPile.push(h2.id);}perHit=cnt*dmgPer;}
        let total=perHit*times;
        const _rawTotal=total;
        if(card.execDmg&&e.hp<e.maxHp*(card.execThreshold||0.25)){total=(card.execDmg+(b.rageBonus||0)+(b.atkBuff||0))*times;}
        if(b.playerWeakness>0)total=Math.max(0,total-b.playerWeakness);
        if(e.dodge&&Math.random()<e.dodge){if(rect)floatText(rect,'闪避','#8ab8ff');addLog(`${e.name} 闪避了攻击！`,'#8ab8ff');continue;}
        if(card.executeInstakill&&e.hp/e.maxHp<card.executeInstakill&&!e.boss){total=e.hp;addLog(`死亡凝视！${e.name} 被直接斩杀`,'#c080ff');}
        if(card.special==='poisonDetonate'){const p=e.poison||0;total=p*2;e.poison=0;}
        if(card.pierce){e.hp-=total;}else{const absorbed=Math.min(e.shield,total);e.shield-=absorbed;e.hp-=(total-absorbed);}
        if(e.shieldUp&&total>0&&e.hp>0){e.shield+=e.shieldUp;addLog(`  ${e.name} 硬化外壳，+${e.shieldUp} 护盾`,'#80b0ff');}
        /* 怪物荆棘：同样是「按当前层数反伤 → 消耗 1 层 → ≥2 层则本回合锁定」 */
        if(e.thorns>0&&total>0&&!e.thornLocked){
          const lay=e.thorns;
          G.hp=Math.max(0,G.hp-lay);
          e.thorns=lay-1;
          if(lay>=2)e.thornLocked=true;
          addLog(`  ${e.name} 的荆棘反击，你受到 ${lay} 伤害（荆棘 ${lay}→${e.thorns}${e.thornLocked?'，本回合不再触发':''}）`,'#ffaa40');
        }
        if(card.weaken)e.weakness=(e.weakness||0)+card.weaken;
        if(card.poison)e.poison=(e.poison||0)+card.poison;
        if(b.venomCoat&&e)e.poison=(e.poison||0)+b.venomCoat;
        if(card.stun){e.stunned=true;e.intent=null;}
        if(card.hp)G.hp=Math.min(G.maxHp,G.hp+card.hp);
        if(card.ifSameNameDraw&&sameNameCount>0)drawCards(card.ifSameNameDraw);
        if(card.execBonusDraw&&e.hp<e.maxHp*(card.execThreshold2||0.4)){drawCards(card.execBonusDraw);b.energy+=1;}
        if(card.draw)drawCards(card.draw);
        const hitRect=rect?{left:rect.left,top:rect.top,width:rect.width,height:rect.height}:null;
        if(hitRect)floatText(hitRect,'-'+total,'#ff8080');
        addLog(`你使用【${card.name}】对 ${e.name} 造成 ${total} 伤害`+((e.shield<=0&&total>=999)?'':'')+(e.dead||e.hp<=0?'（击杀）':''),'#ff9090');
      }
    }
  }else if(card.type==='defend'){
    let sh=card.sh||0;
    if(card.special==='scrapShield'){sh=Math.floor(discardCount/2);if(sh<1)sh=1;}
    else if(card.special==='scrapShield2'){sh=Math.floor(discardCount/2)*2;if(sh<2)sh=2;}
    else if(card.special==='boneGuard'){
      const took=takeFromDiscardByType('defend');
      if(took){addCardToHand(took);addLog(`骸骨守护：取回【${CARDS[took].name}】`,'#8ab8ff');}else{addLog('骸骨守护：弃牌堆无防御牌','#8a8a9a');}
    }
    else if(card.special==='ashReborn'){
      const consumeCount=Math.min(card.consume,discardCount);
      for(let i=0;i<consumeCount;i++){b.discardPile.pop();}
      addLog(`灰烬重生：消耗弃牌堆 ${consumeCount} 张，获得 ${sh} 护盾`,'#ffaa40');
    }
    else if(card.special==='scrapReform'||card.special==='scrapReform2'){
      const cnt=b.discardPile.length;
      b.drawPile=shuffle(b.drawPile.concat(b.discardPile));
      b.discardPile=[];
      addLog(`废牌重组：${cnt} 张弃牌洗回牌库`,'#8ef08e');
      showShuffleAnim();
      if(card.special==='scrapReform')sh=Math.min(cnt,15);
      else sh=Math.min(cnt*2,25);
    }
    if(card.perSkillBonus)sh+=skillCardCount*card.perSkillBonus;
    if(card.ifEnemyAttacks&&b.enemies.some(x=>x.intent&&x.intent.type==='attack'))sh+=card.ifEnemyAttacks;
    b.shield+=sh;
    if(card.thorns)b.thorns+=card.thorns;
    if(card.hp)G.hp=Math.min(G.maxHp,G.hp+card.hp);
    if(card.draw)drawCards(card.draw);
    if(card.atkBuff)b.atkBuff+=card.atkBuff;
    if(card.selfWeaken)b.playerWeakness+=card.selfWeaken;
    if(rect)floatText(rect,'+'+sh+' 盾','#80b0ff');
    addLog(`你使用【${card.name}】，获得 ${sh} 点护盾`,'#80b0ff');
  }else if(card.type==='heal'){
    let healAmt=card.hp||0;
    /* 回血牌特殊机制 */
    if(card.special==='healLostPct')healAmt=Math.max(3,Math.floor((G.maxHp-G.hp)*0.2));
    else if(card.special==='healLostPct2')healAmt=Math.max(5,Math.floor((G.maxHp-G.hp)*0.3));
    else if(card.special==='healPerDiscard'||card.special==='healPerDiscard2'){
      const perCard=card.special==='healPerDiscard2'?3:2;
      const cnt=b.hand.filter(h2=>!h2.entangled).length;
      for(let i=b.hand.length-1;i>=0;i--){if(!b.hand[i].entangled){b.discardPile.push(b.hand[i].id);b.hand.splice(i,1);}}
      healAmt=cnt*perCard;
    }
    else if(card.special==='healPerCardDiscard1'||card.special==='healPerCardDiscard2'){
      const perHeal=card.special==='healPerCardDiscard2'?9:6;
      const cand=b.hand.filter(h2=>!h2.entangled);
      if(cand.length>0){const k=rnd(cand.length);const h2=cand[k];const idx2=b.hand.indexOf(h2);if(idx2>=0){b.discardPile.push(h2.id);b.hand.splice(idx2,1);healAmt=perHeal;}}
    }
    else if(card.special==='healPerHand'||card.special==='healPerHand2'){
      const per=card.special==='healPerHand2'?3:2;
      healAmt=b.hand.length*per;
    }
    else if(card.special==='healByShield')healAmt=defendInHand*2;
    else if(card.special==='healByShield2')healAmt=defendInHand*3;
    else if(card.special==='discardHeal')healAmt=Math.max(2,Math.floor(discardCount/3));
    else if(card.special==='discardHeal2')healAmt=Math.max(3,Math.floor(discardCount/2));

    const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+healAmt);

    if(card.special==='cleanse'){b.playerWeakness=0;b.playerPoison=0;b.playerEntangle=0;b.hand.forEach(h2=>h2.entangled=false);addLog('圣光洗礼：清除所有负面状态','#ffcc33');}
    if(card.special==='regenNextTurn'){b.regenPending=(b.regenPending||0)+4;addLog('再生之种：下回合开始回 4 血','#7ce87c');}
    if(card.special==='regenNextTurn2'){b.regenPending=(b.regenPending||0)+6;addLog('再生之种：下回合开始回 6 血','#7ce87c');}
    if(card.special==='rageOnHeal')b.rageBonus+=2;
    if(card.special==='rageOnHeal2')b.rageBonus+=3;
    if(card.special==='healPerPlayed'){b.echoHealPerPlay=(b.echoHealPerPlay||0)+1;addLog('获得回响治疗：每出一张牌回 1 血','#80e0ff');}
    if(card.special==='healPerPlayed2'){b.echoHealPerPlay=(b.echoHealPerPlay||0)+2;addLog('获得回响治疗：每出一张牌回 2 血','#80e0ff');}
    if(card.special==='drawPenalty'){b.drawPenaltyNext=(b.drawPenaltyNext||0)+2;addLog('生命之泉：下回合少抽 2 张','#8a8a9a');}
    if(card.special==='maxHpCost'){G.maxHp-=3;G.hp=Math.min(G.hp,G.maxHp);addLog('献祭治愈：最大生命 -3','#ff6060');}
    if(card.special==='maxHpCost2'){G.maxHp-=2;G.hp=Math.min(G.hp,G.maxHp);addLog('献祭治愈：最大生命 -2','#ff6060');}

    if(card.selfWeaken)b.playerWeakness+=card.selfWeaken;
    if(rect)floatText(rect,'+'+(G.hp-before)+' HP','#7ce87c');
    addLog(`你使用【${card.name}】，回复 ${G.hp-before} 点生命`,'#7ce87c');
  }else if(card.type==='buff'){
    if(card.special==='discardVault'){const gain=Math.min(discardCount,10);G.gold+=gain;addLog(`弃牌金库：弃牌堆 ${discardCount} 张，获得 ${gain} 金币`,'#ffcc33');}
    if(card.special==='discardVault2'){const gain=Math.min(discardCount*2,20);G.gold+=gain;addLog(`弃牌金库：弃牌堆 ${discardCount} 张，获得 ${gain} 金币`,'#ffcc33');}
    if(card.rageBonus)b.rageBonus+=card.rageBonus;
    if(card.energyTemp)b.energy+=card.energyTemp;
    if(card.energyGain)b.energy=Math.min(b.maxEnergy,b.energy+card.energyGain);
    if(card.atkBuff)b.atkBuff+=card.atkBuff;
    if(card.doubleNext)b.doubleNext=true;
    if(card.magic)b.magic=true;
    if(card.nextTurnBuff)b.nextTurnBuff=(b.nextTurnBuff||0)+card.nextTurnBuff;
    if(card.special==='timeHourglass')b.extraEnergyNextTurn+=3;
    if(card.rebirth){b.rebirth=true;addLog('获得重生符效果','#ffcc33');}
    if(card.transferPoison){if(b.playerPoison>0&&b.enemies.length>0){const t=b.enemies[rnd(b.enemies.length)];const amt=b.playerPoison;b.playerPoison=0;t.poison=(t.poison||0)+amt;addLog(`转移 ${amt} 层中毒给 ${t.name}`,'#a0e070');}}
    if(card.randomEffect){const r=rnd(6);if(r===0){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+5);addLog(`命运骰子：回复 ${G.hp-before} 生命`,'#7ce87c');}else if(r===1){b.shield+=6;addLog('命运骰子：获得 6 护盾','#80b0ff');}else if(r===2){G.gold+=15;addLog('命运骰子：获得 15 金币','#ffcc33');}else if(r===3){b.rageBonus+=3;addLog('命运骰子：本回合攻击 +3','#ffcc33');}else if(r===4){drawCards(2);addLog('命运骰子：抽 2 张牌','#8ab8ff');}else{const e=b.enemies[rnd(b.enemies.length)];if(e){e.poison=(e.poison||0)+3;addLog(`命运骰子：${e.name} 获得 3 层中毒`,'#a0e070');}}}
    if(card.draw)drawCards(card.draw);
    if(card.copyRandomCard&&b.hand.length>0){if(b.hand.length<HAND_LIMIT){const k=rnd(b.hand.length);const newH={uid:uid++,id:b.hand[k].id,tempCost:null,entangled:false};b.hand.push(newH);b.newDrawUids.push(newH.uid);addLog(`复制了【${CARDS[b.hand[k].id].name}】`,'#c080ff');}else{showWarnAnim('手牌上限已满，复制失败');}}
    if(card.selfWeaken)b.playerWeakness+=card.selfWeaken;
    if(rect)floatText(rect,'！','#ffcc33');
    addLog(`你使用【${card.name}】`,'#c0a0ff');
  }else if(card.type==='draw'){
    if(card.special==='discardRecall'){
      let cnt=0;
      for(let i=0;i<card.recallCount;i++){
        if(b.discardPile.length===0)break;
        const k=rnd(b.discardPile.length);
        const id=b.discardPile.splice(k,1)[0];
        if(addCardToHand(id))cnt++;else{b.discardPile.push(id);break;}
      }
      addLog(`${card.name}：从弃牌堆取回 ${cnt} 张牌`,'#8ab8ff');
    }
    else if(card.special==='timeCapsule'){
      for(let i=0;i<2;i++){
        if(b.discardPile.length===0)break;
        const k=rnd(b.discardPile.length);
        const id=b.discardPile.splice(k,1)[0];
        addCardToHand(id);
      }
      addLog('时间胶囊：从弃牌堆取回 2 张牌','#8ab8ff');
    }
    else if(card.special==='reincarnation'){
      if(b.discardPile.length>0){
        const cnt=b.discardPile.length;
        b.drawPile=shuffle(b.drawPile.concat(b.discardPile));
        b.discardPile=[];
        addLog(`轮回转生：弃牌堆 ${cnt} 张洗回牌库`,'#8ef08e');
        showShuffleAnim();
      }
      drawCards(card.draw||2);
    }
    else if(card.special==='deathEcho'){
      if(b.discardPile.length>0){
        const k=rnd(b.discardPile.length);
        const id=b.discardPile.splice(k,1)[0];
        addCardToHand(id);
        addLog(`死亡回响：弃牌堆随机取回【${CARDS[id].name}】`,'#80e0ff');
      }
      if(card.draw)drawCards(card.draw);
    }
    else if(card.special==='discardDraw'||card.special==='discardDraw2'){
      const div=card.special==='discardDraw2'?3:4;
      const n=Math.max(1,Math.floor(discardCount/div));
      drawCards(n);
      addLog(`${card.name}：弃牌堆 ${discardCount} 张，抽 ${n} 张`,'#8ab8ff');
    }
    else if(card.special==='voidDrain'){
      if(b.drawPile.length===0&&b.discardPile.length>0){b.drawPile=shuffle(b.discardPile);b.discardPile=[];showShuffleAnim();}
      if(b.drawPile.length>0){const id=b.drawPile.pop();const cost=CARDS[id].cost;if(b.hand.length<HAND_LIMIT){const newH={uid:uid++,id,tempCost:null,entangled:false};b.hand.push(newH);b.newDrawUids.push(newH.uid);b.energy+=cost;addLog(`虚空汲取：抽到【${CARDS[id].name}】，获得 ${cost} 能量`,'#8ab8ff');}}
    }
    else{
      if(card.drawFromDiscard){for(let i=0;i<card.drawFromDiscard;i++){if(b.discardPile.length===0)break;const k=rnd(b.discardPile.length);const id=b.discardPile.splice(k,1)[0];addCardToHand(id);}addLog(`你使用【${card.name}】，从弃牌堆抽牌`,'#8ab8ff');}
      if(card.perSameNameDraw){const n=sameNameCount*card.perSameNameDraw;if(n>0)drawCards(n);}
      if(card.draw)drawCards(card.draw);
      if(card.selfDiscard){const n=Math.min(card.selfDiscard,b.hand.filter(h2=>!h2.entangled).length);for(let i=0;i<n;i++){const cand=b.hand.filter(h2=>!h2.entangled);if(!cand.length)break;const k=rnd(cand.length);const h2=cand[k];const idx2=b.hand.indexOf(h2);if(idx2>=0){b.discardPile.push(h2.id);b.hand.splice(idx2,1);}}}
      if(card.energyGain)b.energy=Math.min(b.maxEnergy,b.energy+card.energyGain);
      if(card.energyGain||card.draw||card.perSameNameDraw)addLog(`你使用【${card.name}】`,'#8ab8ff');
    }
  }else if(card.type==='debuff'){
    const e=b.enemies[targetIdx];
    if(e&&e.intent&&e.intent.type==='attack')e.intent.value=Math.max(0,e.intent.value-(card.weakenVal||0));
    if(!card.special){if(rect)floatText(rect,'虚弱','#c080ff');addLog(`你使用【${card.name}】，削弱 ${targetName}`,'#c080ff');}
  }

  if(b.echoHealPerPlay>0){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+b.echoHealPerPlay);if(G.hp>before)addLog(`回响治疗：回复 ${G.hp-before} 点生命`,'#80e0ff');}

  /* 新卡牌特殊机制 */
  applyNewCardSpecial(card,b,targetIdx,rect);
  applySp2(card,b,targetIdx,rect);
  applySpecial2(card,b,targetIdx,rect);

  checkDeaths();
  if(G.hp<=0){
    if(b.rebirth&&!b.rebirthUsed){b.rebirthUsed=true;G.hp=Math.ceil(G.maxHp*0.5);addLog('重生符激活！','#ffcc33');render();return;}
    G.hp=0;G.screen='over';render();return;
  }
  if(b.enemies.length===0)return;
  render();
}

function checkDeaths(){
  const b=G.battle;
  const dead=b.enemies.filter(e=>e.hp<=0);
  if(!dead.length)return;
  for(const e of dead){
    const idx=b.enemies.indexOf(e);if(idx<0)continue;
    if(e.revive&&!b.revived.has(e.id)){b.revived.add(e.id);e.hp=Math.ceil(e.maxHp*0.5);e.revive=false;addLog(`${e.name} 复活了！`,'#c080ff');continue;}
    addLog(`${e.name} 被击败！`,'#8ef08e');
    if(e.deathBlast){G.hp=Math.max(0,G.hp-e.deathBlast);addLog(`  ${e.name} 炸裂，你受到 ${e.deathBlast} 伤害`,'#ff6060');}
    if(e.deathCurse){G.battle.playerPoison=(G.battle.playerPoison||0)+e.deathCurse;addLog(`  ${e.name} 留下诅咒，+${e.deathCurse} 中毒`,'#a0e070');}
    b.enemies.splice(idx,1);
    if(e.canSplit){const room=Math.max(0,5-b.enemies.length);const n=Math.min(3,room);for(let k=0;k<n;k++)b.enemies.splice(idx+k,0,makeSlimeS());if(n>0)addLog(`  史莱姆分裂成 ${n} 只小史莱姆！`,'#8ef08e');}
    if(e.summon&&b.enemies.length<4){const s=makeEnemyFromDef('skel',ENEMY_DEFS.skel,1);b.enemies.push(s);addLog(`  ${e.name} 召唤了一个骷髅兵！`,'#c080ff');}
  }
  if(b.enemies.length===0&&!b.over){b.over=true;render();setTimeout(winBattle,420);}
}

function floatText(rect,text,color){if(!rect)return;const el=document.createElement('div');el.className='float-text';el.textContent=text;const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;el.style.left=cx+'px';el.style.top=cy+'px';el.style.color=color;document.body.appendChild(el);setTimeout(()=>el.remove(),1200);}

function useItem(idx){
  const id=G.items[idx];if(id===undefined)return;const it=ITEMS[id];
  if(it.use==='none')return;
  if(G.screen==='map'){if(it.use!=='any')return;if(id==='luckyCoin')G.gold+=20;else if(id==='luckyDice'){const g=10+rnd(41);G.gold+=g;}else if(id==='soulStone'){G.maxHp+=6;G.hp=Math.min(G.maxHp,G.hp+6);}else if(id==='lifeCharm'){G.maxHp+=3;G.hp=Math.min(G.maxHp,G.hp+3);}G.items.splice(idx,1);render();return;}
  if(G.screen!=='battle')return;const b=G.battle;if(!b||b.busy||b.over)return;
  if(id==='healPotion'){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+5);addLog(`使用【恢复药水】，回复 ${G.hp-before} 点生命`,'#7ce87c');}
  else if(id==='shieldPotion'){b.shield+=6;addLog(`使用【护盾药水】，获得 6 点护盾`,'#80b0ff');}
  else if(id==='atkPotion'){b.rageBonus+=2;addLog(`使用【攻击药水】，本回合攻击 +2`,'#ffcc33');}
  else if(id==='cardSwap'){let discardable=b.hand.filter(h=>!h.entangled);const n=Math.min(2,discardable.length);for(let i=0;i<n;i++){if(discardable.length===0)break;const k=rnd(discardable.length);const h=discardable[k];const idx2=b.hand.indexOf(h);if(idx2>=0){b.discardPile.push(h.id);b.hand.splice(idx2,1);}discardable.splice(k,1);}drawCards(2);addLog(`使用【换卡器】，弃 ${n} 张并抽 2 张`,'#8ab8ff');}
  else if(id==='energyPotion'){b.energy+=2;addLog(`使用【能量药水】，本回合 +2 能量`,'#ffd75a');}
  else if(id==='drawScroll'){drawCards(3);addLog(`使用【抽牌卷轴】，抽 3 张牌`,'#8ab8ff');}
  else if(id==='bomb'){for(const e of b.enemies){const absorbed=Math.min(e.shield,5);e.shield-=absorbed;e.hp-=(5-absorbed);}addLog(`使用【炸弹】，对所有敌人造成 5 伤害`,'#ff8080');checkDeaths();}
  else if(id==='dagger'){const alive=b.enemies.filter(e=>e.hp>0);if(alive.length){alive.sort((a,c)=>c.hp-a.hp);const t=alive[0];const absorbed=Math.min(t.shield,8);t.shield-=absorbed;t.hp-=(8-absorbed);addLog(`使用【飞刀】，对 ${t.name} 造成 8 伤害`,'#ff8080');checkDeaths();}}
  else if(id==='luckyCoin'){G.gold+=20;addLog(`使用【幸运币】，获得 20 金币`,'#ffcc33');}
  else if(id==='smokeBomb'){for(const e of b.enemies){if(e.intent&&e.intent.type==='attack')e.intent.value=Math.max(0,e.intent.value-3);}addLog(`使用【烟雾弹】，所有敌人攻击 -3`,'#c080ff');}
  else if(id==='lifeCharm'){G.maxHp+=3;G.hp=Math.min(G.maxHp,G.hp+3);addLog(`使用【生命护符】，最大生命 +3，回复 3 血`,'#7ce87c');}
  else if(id==='doublePotion'){b.doubleNext=true;addLog(`使用【双倍药水】，下一张攻击牌效果翻倍`,'#c080ff');}
  else if(id==='ironShield'){b.shield+=10;addLog(`使用【铁盾符】，获得 10 点护盾`,'#80b0ff');}
  else if(id==='purify'){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+3);drawCards(1);addLog(`使用【净化水】，回复 ${G.hp-before} 血并抽 1 张`,'#7ce87c');}
  else if(id==='cleanseCharm'){b.playerEntangle=0;b.playerWeakness=0;b.playerPoison=0;b.hand.forEach(h=>h.entangled=false);addLog(`使用【驱散护符】，清除所有负面状态`,'#c080ff');}
  else if(id==='hourglassItem'){if(b.countdowns&&b.countdowns.length){for(const c of b.countdowns)c.left=Math.max(1,c.left-1);addLog('使用【时间沙漏】，所有倒计时 -1','#c080ff');}else addLog('没有正在倒计时的牌','#8a8a9a');}
  else if(id==='rageElixir'){b.rageBonus+=5;addLog('使用【狂暴药剂】，本回合攻击 +5','#ffcc33');}
  else if(id==='thornPotion'){b.thorns=(b.thorns||0)+5;addLog('使用【荆棘药水】，获得 5 层荆棘','#ffaa40');}
  else if(id==='poisonFlask'){for(const e of b.enemies)if(e.hp>0)e.poison=(e.poison||0)+5;addLog('使用【毒瓶】，全体 +5 中毒','#a0e070');}
  else if(id==='shieldToDamage'){const d=(b.shield||0)*2;if(d>0){for(const e of b.enemies)if(e.hp>0){const ab=Math.min(e.shield,d);e.shield-=ab;e.hp-=(d-ab);}addLog(`使用【盾之反击】，造成 ${d} 全体伤害`,'#ff8080');}else addLog('没有护盾，无效果','#8a8a9a');}
  else if(id==='springBottle'){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+15);addLog(`使用【生命之泉瓶】，回复 ${G.hp-before} 生命`,'#7ce87c');}
  else if(id==='energyCore'){b.maxEnergy=(b.maxEnergy||3)+1;addLog(`使用【能量核心】，最大能量 +1（现 ${b.maxEnergy}）`,'#ffd75a');}
  else if(id==='purifyFlame'){b.playerPoison=0;b.playerWeakness=0;b.playerEntangle=0;b.hand.forEach(h=>h.entangled=false);const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+8);addLog(`使用【净化之焰】，清空负面并回复 ${G.hp-before}`,'#7ce87c');}
  else if(id==='drawStorm'){drawCards(5);addLog('使用【抽牌风暴】，抽 5 张','#8ab8ff');}
  else if(id==='mirrorScroll'){if(b.hand.length){const src=b.hand[rnd(b.hand.length)];if(b.hand.length<HAND_LIMIT){const nh={uid:uid++,id:src.id,tempCost:0,entangled:false};b.hand.push(nh);b.newDrawUids.push(nh.uid);addLog(`使用【镜像卷轴】，复制【${CARDS[src.id].name}】（0费）`,'#c080ff');}else addLog('手牌已满','#8a8a9a');}else addLog('手牌为空','#8a8a9a');}
  else if(id==='weakenDust'){for(const e of b.enemies)if(e.hp>0)e.weakness=(e.weakness||0)+5;addLog('使用【弱化粉尘】，全体虚弱 5','#c080ff');}
  else if(id==='entangleVine'){for(const e of b.enemies)if(e.hp>0&&e.intent&&e.intent.type==='attack')e.intent.value=0;addLog('使用【缠绕藤蔓】，全体敌人攻击清零','#ffa0e0');}
  else if(id==='revengeCharm'){G.atkBuff=(G.atkBuff||0)+2;b.atkBuff=(b.atkBuff||0)+2;addLog('使用【复仇符】，本场攻击 +2','#ffcc33');}
  else if(id==='thornCharm'){b.shield+=12;addLog('使用【荆棘护符】，获得 12 护盾','#80b0ff');}
  else if(id==='bloodCharm'){G.atkBuff=(G.atkBuff||0)+3;b.atkBuff=(b.atkBuff||0)+3;G.hp=Math.max(1,G.hp-4);addLog('使用【嗜血符】，攻击 +3，失去 4 血','#e04060');}
  else if(id==='timeAccel'){drawCards(2);b.energy+=1;addLog('使用【时间加速】，抽 2 张并获得 1 能量','#8ab8ff');}
  else if(id==='ironBody'){b.shield+=20;addLog('使用【铁壁药剂】，获得 20 护盾','#80b0ff');}
  else if(id==='soulStone'){G.maxHp+=6;G.hp=Math.min(G.maxHp,G.hp+6);addLog('使用【灵魂石】，最大生命 +6','#7ce87c');}
  else if(id==='doomRune'){for(const e of b.enemies)if(e.hp>0){const ab=Math.min(e.shield,20);e.shield-=ab;e.hp-=(20-ab);}addLog('使用【毁灭符】，全体 20 伤害','#ff8080');}
  G.items.splice(idx,1);
  if(G.hp<=0){if(b.rebirth&&!b.rebirthUsed){b.rebirthUsed=true;G.hp=Math.ceil(G.maxHp*0.5);addLog('重生符激活！','#ffcc33');render();return;}G.hp=0;G.screen='over';render();return;}
  if(b.enemies.length===0)return;
  render();
}

function endTurn(){
  const b=G.battle;if(!b||b.busy||b.over)return;b.busy=true;
  const toDiscard=[];const toKeep=[];
  const handEls=[...document.querySelectorAll('.hand .card')];
  b.hand.forEach((h,i)=>{
    const card=CARDS[h.id];
    if(card.retain){toKeep.push(h);}   /* 只有「保留」词条留手，缠绕牌回合结束照常弃掉 */
    else{toDiscard.push({h,el:handEls[i]});}
  });
  toDiscard.forEach(({el},i)=>{if(el){el.style.transition='all 260ms ease-in';el.style.transform=`translate(${(i-1)*14}px,90px) rotate(${(i-1)*10}deg)`;el.style.opacity='0';}});
  const cards=toDiscard.map(x=>x.h);b.hand=toKeep;
  b.playerWeakness=0;
  setTimeout(()=>{
    for(const h of cards)b.discardPile.push(h.id);
    const keepInfo=toKeep.length>0?`，${toKeep.length} 张因「保留」留在手上`:'';
    addLog(`结束回合，弃掉 ${cards.length} 张手牌${keepInfo}`,'#8a8ab0');
    render();setTimeout(enemyPhase,180);
  },280);
}

function enemyPhase(){
  const b=G.battle;if(!b||b.over)return;b.enemies.forEach(e=>{if(e.shield)e.shield=0;});
  /* 自爆倒计时 */
  for(const e of b.enemies){
    if(e.hp<=0||!e.bombArmed)continue;
    e.bombLeft=(e.bombLeft||0)-1;
    if(e.bombLeft<=0){
      const dmg=Math.round((e.dmgMax||5)*3);
      G.hp=Math.max(0,G.hp-dmg);
      addLog(`${e.name} 自爆！你受到 ${dmg} 伤害`,'#ff5050');
      e.hp=0;
    }
  }
  /* 新小怪：回合开始光环 */
  for(const e of b.enemies){
    if(e.hp<=0)continue;
    if(e.enrage){const step=e.enrage;e.dmgMin+=step;e.dmgMax+=step;if(e.intent&&e.intent.type==='attack')e.intent.value+=step;}
    if(e.poisonAura){b.playerPoison=(b.playerPoison||0)+e.poisonAura;}
    if(e.weakAura){b.playerWeakness=(b.playerWeakness||0)+e.weakAura;}
    if(e.thornsGrow){e.thorns=(e.thorns||0)+e.thornsGrow;}
  }
  if(b.overloadDmg>0){const od=b.overloadDmg;b.overloadDmg=0;G.hp-=od;addLog(`超载反噬，受到 ${od} 伤害`,'#ff8080');if(G.hp<=0){if(b.rebirth&&!b.rebirthUsed){b.rebirthUsed=true;G.hp=Math.ceil(G.maxHp*0.5);addLog('重生符激活！','#ffcc33');}else{G.hp=0;G.screen='over';render();return;}}}
  if(b.playerPoison>0){G.hp-=b.playerPoison;addLog(`中毒造成 ${b.playerPoison} 伤害`,'#a0e070');b.playerPoison--;if(G.hp<=0){if(b.rebirth&&!b.rebirthUsed){b.rebirthUsed=true;G.hp=Math.ceil(G.maxHp*0.5);addLog('重生符激活！','#ffcc33');}else{G.hp=0;G.screen='over';render();return;}}}
  b.enemies.forEach(e=>{if(e.poison>0&&e.hp>0){e.hp-=e.poison;addLog(`${e.name} 受到 ${e.poison} 点中毒伤害`,'#a0e070');if(!e.poisonLock)e.poison--;}});
  checkDeaths();
  if(b.over)return;
  render();
  const acted=new Set();
  setTimeout(function step(){
    if(!b||b.over)return;
    if(G.hp<=0){if(b.rebirth&&!b.rebirthUsed){b.rebirthUsed=true;G.hp=Math.ceil(G.maxHp*0.5);addLog('重生符激活！','#ffcc33');}else{G.hp=0;G.screen='over';render();return;}}
    const e=b.enemies.find(x=>!acted.has(x.id)&&x.hp>0);
    if(!e){b.shield=0;addLog('敌方回合结束，你的护盾消失','#8a8ab0');startPlayerTurn();return;}
    acted.add(e.id);
    if(e.stunned||!e.intent){e.stunned=false;e.intent=null;addLog(`${e.name} 处于眩晕，跳过行动`,'#ffcc33');render();setTimeout(step,320);return;}
    const it=e.intent;const el=document.querySelector(`[data-uid="${e.id}"]`);const rect=el?el.getBoundingClientRect():null;
    if(it.type==='attack'&&el){el.classList.add('atk-anim');setTimeout(()=>el.classList.remove('atk-anim'),140);}
    setTimeout(()=>{
      if(!b||b.over)return;
      if(it.type==='charge'){
        if(rect)floatText(rect,'蓄力！','#ff3030');
        addLog(`${e.name} 正在蓄力，下次攻击 ${it.value} 伤害！`,'#ff3030');
        /* 蓄力完成：把意图换成一次重击，下回合真正打出 */
        e.intent={type:'attack',value:it.value,heavy:true};
      }else if(it.type==='multi'){
        let totalHit=0;
        for(const v of it.hits){
          let d=v;if(e.weakness>0)d=Math.max(0,d-e.weakness);
          const ab=Math.min(b.shield,d);b.shield-=ab;d-=ab;G.hp-=d;b.dmgTaken=(b.dmgTaken||0)+d;totalHit+=d;
        }
        const pr0=document.querySelector('[data-player-drop]');
        if(pr0)floatText(pr0.getBoundingClientRect(),'-'+totalHit,'#ff6060');
        addLog(`${e.name} 连击 ${it.hits.length} 次，共 ${totalHit} 伤害`,'#ff6060');
      }else if(it.type==='discard'){
        /* 玩家回合结束就弃牌了，此刻手牌几乎为空：
           延后到你下个回合（抽完牌后）再结算，才不会打在空气上 */
        b.pendingDiscard=(b.pendingDiscard||0)+it.value;
        addLog(`${e.name} 记下了你的手牌，下回合开始时打落 ${it.value} 张`,'#c080ff');
      }else if(it.type==='curse'){
        for(let i=0;i<it.value;i++){b.discardPile.push('attack');b.drawPile.push('attack');}
        addLog(`${e.name} 往你的牌库塞了 ${it.value} 张废牌`,'#c080ff');
        showWarnAnim('牌库被污染！');
      }else if(it.type==='arm'){
        e.bombLeft=it.value;
        addLog(`${e.name} 开始自爆倒计时：${it.value} 回合`,'#ff5050');
        if(rect)floatText(rect,'倒计时 '+it.value,'#ff5050');
      }else if(it.type==='summon'){
        if(b.enemies.length<4){
          const s2=makeEnemyFromDef('skel',ENEMY_DEFS.skel,1);
          b.enemies.push(s2);
          addLog(`${e.name} 召唤了 ${s2.name}！`,'#c080ff');
        }else addLog(`${e.name} 想召唤，但场上已满`,'#8a8a9a');
      }else if(it.type==='transfer'){
        let moved=0;
        if(e.poison>0){b.playerPoison+=e.poison;moved+=e.poison;e.poison=0;}
        if(e.weakness>0){b.playerWeakness+=e.weakness;moved+=e.weakness;e.weakness=0;}
        addLog(moved?`${e.name} 把 ${moved} 层负面转嫁给你！`:`${e.name} 想要转嫁，但没有负面`,'#c080ff');
      }else if(it.type==='attack'){
        let dmg=it.value;if(e.weakness>0)dmg=Math.max(0,dmg-e.weakness);
        if(e.charging){e.charging=false;e.chargeHold=false;if(!it.heavy)dmg=Math.round(dmg*2.2);addLog(`${e.name} 的蓄力爆发！`,'#ff3030');}
        const absorbed=Math.min(b.shield,dmg);b.shield-=absorbed;dmg-=absorbed;G.hp-=dmg;b.dmgTaken=(b.dmgTaken||0)+dmg;
        if(e.weakOnHit)b.playerWeakness+=e.weakOnHit;
        if(e.poisonOnHit)b.playerPoison+=e.poisonOnHit;
        if(e.entangleOnHit&&Math.random()<0.5){b.pendingEntangle=(b.pendingEntangle||0)+e.entangleOnHit;addLog(`${e.name} 的藤蔓缠住了你的手，下回合生效`,'#ffa0e0');}
        /* 荆棘：触发时按「当前层数」反伤，然后消耗 1 层；层数≥2 时触发后本回合不再触发 */
        if(b.thorns>0&&!b.thornLocked){
          const layer=b.thorns;
          e.hp-=layer;
          b.thorns=layer-1;
          if(layer>=2)b.thornLocked=true;
          if(rect)floatText(rect,'反伤-'+layer,'#ffaa40');
          addLog(`${e.name} 撞上荆棘，受到 ${layer} 伤害（荆棘 ${layer}→${b.thorns}${b.thornLocked?'，本回合不再触发':''}）`,'#ffaa40');
        }
        if(e.drain&&dmg>0){e.hp=Math.min(e.maxHp,e.hp+e.drain);addLog(`${e.name} 吸血恢复 ${e.drain} 点生命`,'#e04060');}
        if(e.stealGold&&G.gold>0){const g=Math.min(G.gold,e.stealGold);G.gold-=g;addLog(`${e.name} 偷走 ${g} 金币`,'#ffcc33');}
        const pr=document.querySelector('[data-player-drop]');
        if(pr){pr.classList.add('hit-anim');setTimeout(()=>pr.classList.remove('hit-anim'),320);const pr2=pr.getBoundingClientRect();if(dmg>0)floatText(pr2,'-'+dmg,'#ff6060');else if(absorbed>0)floatText(pr2,'盾 '+absorbed,'#80b0ff');}
        addLog(`${e.name} 攻击，造成 ${dmg} 伤害`+(absorbed>0?`（护盾吸收${absorbed}）`:''),'#ff6060');
      }else if(it.type==='defend'){
        e.shield+=it.value;if(rect)floatText(rect,'+'+it.value+' 盾','#80b0ff');addLog(`${e.name} 防御，获得 ${it.value} 护盾`,'#80b0ff');
      }else if(it.type==='debuff'){
        if(it.effect==='weak'){b.playerWeakness+=it.value;addLog(`${e.name} 施放虚弱，你获得 ${it.value} 层虚弱`,'#c080ff');}
        else if(it.effect==='poison'){b.playerPoison+=it.value;addLog(`${e.name} 施放剧毒，你获得 ${it.value} 层中毒`,'#a0e070');}
        else if(it.effect==='entangle'){b.pendingEntangle=(b.pendingEntangle||0)+it.value;addLog(`${e.name} 施放缠绕，下回合开始时锁住 ${it.value} 张手牌`,'#ffa0e0');}
        const pr=document.querySelector('[data-player-drop]');if(pr)floatText(pr.getBoundingClientRect(),'状态！','#c080ff');
      }else if(it.type==='heal'){
        for(const other of b.enemies){if(other!==e&&other.hp<other.maxHp){other.hp=Math.min(other.maxHp,other.hp+it.value);addLog(`${e.name} 治疗了 ${other.name} ${it.value} 点生命`,'#7ce87c');}}
      }else if(it.type==='buff'){
        if(it.effect==='shield'){e.shield+=it.value;addLog(`${e.name} 强化了护盾 +${it.value}`,'#ffe0a0');}
        if(rect)floatText(rect,'强化','#ffe0a0');
      }
      checkDeaths();
      if(b.over)return;
      render();setTimeout(step,340);
    },140);
  },260);
}

function winBattle(){
  const b=G.battle;const isBoss=b.isBoss,isElite=b.isElite;
  let gold;if(isBoss)gold=100+rnd(40);else if(isElite)gold=30+rnd(20);else gold=12+rnd(10);
  const charType=CHARACTERS[G.character].skillType;
  if(charType==='goldBoost')gold=Math.floor(gold*1.5);
  G.gold+=gold;
  let healed=0;
  if(charType==='heal4'){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+4);healed=G.hp-before;}
  let cardDrop=null;const cardChance=isBoss?1:isElite?0.5:0.3;if(Math.random()<cardChance){cardDrop=pick(CARD_POOL);G.deck.push(cardDrop);}
  let itemDrop=null,itemFull=false;const itemChance=(charType==='itemChance60'&&Math.random()<0.6);if(isElite||isBoss||Math.random()<0.15||itemChance){const iid=pick(ITEM_KEYS);if(G.items.length<3){G.items.push(iid);itemDrop=iid;}else itemFull=true;}
  let swordMsg=null;
  const swIdx=G.items.indexOf('swordInStone');
  if(swIdx>=0){G.swordCount=(G.swordCount||0)+1;if(G.swordCount>=5){G.items[swIdx]='excalibur';G.atkBuff=(G.atkBuff||0)+2;swordMsg='石中剑化为宝剑！攻击力永久+2';}else swordMsg=`石中剑进度 ${G.swordCount}/5`;}
  let expGain=isBoss?5:isElite?2:1;G.exp+=expGain;let leveled=false;
  if(G.exp>=G.expNeeded){G.exp-=G.expNeeded;G.level++;G.expNeeded=Math.max(1,Math.ceil((G.level+1)*0.5));G.maxHp+=8;G.hp=Math.min(G.maxHp,G.hp+5);leveled=true;}
  G.extra={gold,healed,cardDrop,itemDrop,itemFull,isElite,isBoss,leveled,expGain,swordMsg};
  if(isBoss){if(G.chapter<CHAPTERS.length-1){G.screen='reward';G.extra.isChapterEnd=true;render();return;}G.screen='win';render();return;}
  if(leveled){G.extra.levelCards=shuffle(CARD_POOL).slice(0,3);G.screen='levelup';}else{G.screen='reward';}
  render();
}

function vLevelUp(){const cards=G.extra.levelCards||[];const opts=cards.map((id,i)=>`<div class="stone-card" onclick="chooseLevelCard(${i})">${cardHTML(id,{attr:'style="cursor:pointer;pointer-events:none"'})}</div>`).join('');return `<div class="screen event"><h2>⬆ 升 级 ！ ⬆</h2><p style="font-size:13px;color:#8ef08e">等级提升至 Lv.${G.level}，最大生命 +8，回复 5 点生命</p><p>选择一张卡牌加入卡组</p><div class="cardpick">${opts}</div></div>`;}
function chooseLevelCard(i){const cards=G.extra.levelCards||[];const id=cards[i];if(id){G.deck.push(id);}G.extra.levelCards=null;G.screen='reward';render();}

function vReward(){const ex=G.extra;const chapterEnd=ex.isChapterEnd&&G.chapter<CHAPTERS.length-1;return `<div class="screen event"><h2>⚔ 战 斗 胜 利 ⚔</h2>${spr(CHARACTERS[G.character].icon,5)}<div class="rewardbox"><p class="good">获得 ${ex.gold} 金币</p><p class="good">获得 ${ex.expGain} 经验（Lv.${G.level} ${G.exp}/${G.expNeeded}）</p>${ex.healed>0?`<p class="good">技能回复 ${ex.healed} 点生命（${G.hp}/${G.maxHp}）</p>`:''}${ex.cardDrop?`<p class="good">获得卡牌【${CARDS[ex.cardDrop].name}】</p>`:''}${ex.itemDrop?`<div class="item-reward">${itemIcon(ex.itemDrop,2)}<span>获得道具【${ITEMS[ex.itemDrop].name}】</span></div>`:''}${ex.itemFull?`<p class="bad">道具栏已满，未获得道具</p>`:''}${ex.swordMsg?`<p class="good">${ex.swordMsg}</p>`:''}</div><p>当前金币：${G.gold}</p>${chapterEnd?`<button class="btn gold" onclick="nextChapter()">进入下一章 ▶</button>`:`<button class="btn gold" onclick="toMap()">继续前进 ▶</button>`}</div>`;}
function toMap(){G.screen='map';render();}
function nextChapter(){G.chapter++;G.map=genMap();G.pos=-1;G.chosen=[];G.hp=Math.min(G.maxHp,G.hp+5);G.screen='map';render();}

function doChest(){const greed=CHARACTERS[G.character].skillType==='greed';G.chestOptions=shuffle(CARD_POOL).slice(0,greed?4:3);delete G.extra.card;G.extra.chestPicked=[];G.extra.chestPicks=greed?2:1;G.screen='chest';render();}
function vChest(){
  const picked=G.extra.chestPicked||[];
  if((G.extra.chestPicks||0)<=0||!G.chestOptions||!G.chestOptions.length){
    const list=picked.map(id=>`<p class="good">「${CARDS[id].name}」已加入卡组</p>`).join('');
    return `<div class="screen event"><h2>📦 发 现 宝 箱</h2><p>你从宝箱中拿出了：</p>${list||'<p class="bad">什么都没有</p>'}<button class="btn gold" onclick="toMap()">继续前进 ▶</button></div>`;
  }
  const opts=G.chestOptions.map((id,i)=>cardHTML(id,{attr:`onclick="takeChest(${i})" style="cursor:pointer"`})).join('');
  const left=G.extra.chestPicks||1;
  return `<div class="screen event"><h2>📦 发 现 宝 箱</h2><p>选择一张卡牌加入你的卡组${left>1?`（还可以选 ${left} 张）`:''}</p><div class="cardpick">${opts}</div></div>`;
}
function takeChest(i){
  if(!G.chestOptions||G.chestOptions[i]===undefined)return;
  const id=G.chestOptions[i];
  G.deck.push(id);
  if(!G.extra.chestPicked)G.extra.chestPicked=[];
  G.extra.chestPicked.push(id);
  G.chestOptions.splice(i,1);
  G.extra.chestPicks=(G.extra.chestPicks||1)-1;
  if((G.extra.chestPicks||0)<=0)G.chestOptions=[];
  render();
}

function doRest(){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+6);G.extra.heal=G.hp-before;G.screen='rest';render();}
function vRest(){return `<div class="screen event"><h2>🔥 篝 火 休 息</h2>${spr('fire',6)}<p>你坐在篝火旁，短暂地恢复了体力。</p><p class="good">回复了 ${G.extra.heal} 点生命（${G.hp}/${G.maxHp}）</p><button class="btn gold" onclick="toMap()">继续前进 ▶</button></div>`;}

function doShop(){const pool=shuffle(CARD_POOL);G.shopStock=pool.slice(0,3).map(id=>({id,price:CARDS[id].cost>=2?34:18,sold:false}));G.shopRecycleUsed=false;G.shopRecycleMode=false;G.screen='shop';render();}
function vShop(){const items=G.shopStock.map((s,i)=>{const c=CARDS[s.id];const afford=G.gold>=s.price&&!s.sold;return `<div class="shopitem">${cardHTML(s.id,{disabled:s.sold,attr:s.sold?'':`onpointerdown="event.preventDefault();buyCard(${i})" style="cursor:pointer"`})}${s.sold?`<div class="sold">已售出</div>`:`<div class="price ${afford?'':'no'}">${s.price} 金</div>`}</div>`;}).join('');let recycleHTML='';if(G.shopRecycleMode){const cards=G.deck.map((id,i)=>`<div class="stone-card" onclick="doRecycleCard(${i})">${cardHTML(id,{attr:'style="cursor:pointer;pointer-events:none"'})}</div>`).join('');recycleHTML=`<div class="recycle-wrap">${cards}</div><p style="font-size:10px">点击一张卡牌进行回收（获得其市场价一半）</p><button class="btn" onclick="cancelRecycle()">取消回收</button>`;}else{recycleHTML=(CHARACTERS[G.character].skillType==='greed')?`<div class="sold">贪婪：只进不出，不接受回收</div>`:(G.shopRecycleUsed?`<div class="sold">本店已回收过一次</div>`:`<button class="btn" onclick="startRecycle()">回收一张卡（获得半价）</button>`);}return `<div class="screen event"><h2>🏪 神 秘 商 店</h2><p>当前金币：<span style="color:#ffcc33">${G.gold}</span></p><div class="shopgrid">${items}</div>${recycleHTML}<button class="btn" onclick="toMap()">离开商店 ▶</button></div>`;}
function buyCard(i){const s=G.shopStock[i];if(!s||s.sold||G.gold<s.price)return;G.gold-=s.price;s.sold=true;G.deck.push(s.id);render();}
function startRecycle(){if(CHARACTERS[G.character].skillType==='greed'){showWarnAnim('贪婪：不懂回收，只懂占有');return;}if(G.shopRecycleUsed)return;G.shopRecycleMode=true;render();}
function cancelRecycle(){G.shopRecycleMode=false;render();}
function doRecycleCard(idx){if(!G.shopRecycleMode||G.shopRecycleUsed)return;const id=G.deck[idx];if(!id)return;const basePrice=CARDS[id].cost>=2?34:18;const refund=Math.floor(basePrice/2);G.gold+=refund;G.deck.splice(idx,1);G.shopRecycleUsed=true;G.shopRecycleMode=false;render();}

function doAdventure(){
  const pool=shuffle([
    {key:'maxhp',label:'生命之泉',desc:'最大生命 +5，并回复 5 点生命'},
    {key:'upgrade',label:'锻造台',desc:'随机升级卡组中一张未升级的卡牌'},
    {key:'energy',label:'能量核心',desc:'能量上限 +1（最多 10 点）'},
    {key:'item',label:'道具商',desc:'获得一个随机道具'},
  ]);
  G.advOptions=pool.slice(0,3);G.screen='adventure';render();
}
function vAdventure(){
  const hasUp=G.deck.some(id=>CARDS[id+'+']);
  const maxedEnergy=G.maxEnergy>=10;
  const opts=G.advOptions.map((o,i)=>{
    let disabled=false;let hint='';
    if(o.key==='upgrade'&&!hasUp){disabled=true;hint='已无可升级卡牌';}
    if(o.key==='energy'&&maxedEnergy){disabled=true;hint='能量已达上限';}
    if(o.key==='item'&&G.items.length>=3){disabled=true;hint='道具栏已满';}
    return `<div class="advopt" style="${disabled?'opacity:.4;cursor:not-allowed':''}" ${disabled?'':`onclick="takeAdv(${i})"`}>
      <div class="advname">${o.label}</div>
      <div class="advdesc">${hint||o.desc}</div>
      ${disabled?'<div style="font-size:10px;color:#5a3a3a">无法选择</div>':''}
    </div>`;
  }).join('');
  return `<div class="screen event"><h2>✨ 奇 遇 ✨</h2>${spr('star',5)}<p>神秘旅人让你从中挑选一件礼物（三选一）</p><div class="advgrid">${opts}</div><p style="font-size:11px">生命：${G.hp}/${G.maxHp}　能量上限：${G.maxEnergy}</p></div>`;
}
function takeAdv(i){
  const o=G.advOptions[i];if(!o)return;
  if(o.key==='upgrade'){const idxs=[];G.deck.forEach((id,k)=>{if(CARDS[id+'+'])idxs.push(k);});if(!idxs.length)return;const k=pick(idxs);G.deck[k]=G.deck[k]+'+';}
  else if(o.key==='maxhp'){G.maxHp+=5;G.hp=Math.min(G.maxHp,G.hp+5);}
  else if(o.key==='energy'){if(G.maxEnergy<10)G.maxEnergy++;}
  else if(o.key==='item'){if(G.items.length<3)G.items.push(pick(ITEM_KEYS));}
  G.advOptions=null;G.screen='map';render();
}

function doStone(){if(CHARACTERS[G.character].skillType==='greed'){showWarnAnim('贪婪：这块石头不归我，碰了心里痒');G.screen='map';render();return;}G.stone={mode:null,selected:[]};G.screen='stone';render();}
function vStone(){const st=G.stone;let body='';if(!st.mode){body=`<p>一块散发诡异光芒的怪石。你可以：</p><div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center"><button class="btn gold" onclick="stoneMode('copy')">复制一张卡</button><button class="btn" onclick="stoneMode('discard')">丢弃两张卡</button></div>`;}else if(st.mode==='copy'){const cards=G.deck.map((id,i)=>`<div class="stone-card" onclick="stoneCopy(${i})">${cardHTML(id,{attr:'style="cursor:pointer;pointer-events:none"'})}</div>`).join('');body=`<p>选择一张卡牌复制加入卡组</p><div class="stone-cards">${cards}</div><button class="btn" onclick="cancelStone()">取消</button>`;}else{const cards=G.deck.map((id,i)=>{const sel=st.selected.includes(i);return `<div class="stone-card ${sel?'sel':''}" onclick="stoneToggle(${i})">${cardHTML(id,{attr:'style="cursor:pointer;pointer-events:none"'})}</div>`;}).join('');const ready=st.selected.length===2;body=`<p>选择两张卡牌丢弃（已选 ${st.selected.length}/2）</p><div class="stone-cards">${cards}</div><div style="display:flex;gap:10px"><button class="btn gold" ${ready?'':'disabled'} onclick="stoneConfirmDiscard()">确认丢弃</button><button class="btn" onclick="cancelStone()">取消</button></div>`;}return `<div class="screen event"><h2>🪨 怪 石</h2>${spr('skull',4)}<div class="stone-wrap">${body}</div></div>`;}
function stoneMode(mode){G.stone.mode=mode;G.stone.selected=[];render();}
function stoneCopy(idx){const id=G.deck[idx];if(!id)return;G.deck.push(id);G.stone={mode:null,selected:[]};G.screen='map';render();}
function stoneToggle(idx){const sel=G.stone.selected;const k=sel.indexOf(idx);if(k>=0)sel.splice(k,1);else if(sel.length<2)sel.push(idx);render();}
function stoneConfirmDiscard(){if(G.stone.selected.length!==2)return;const idxs=G.stone.selected.slice().sort((a,b)=>b-a);for(const i of idxs)G.deck.splice(i,1);G.stone={mode:null,selected:[]};G.screen='map';render();}
function cancelStone(){G.stone={mode:null,selected:[]};G.screen='map';render();}

function doForge(){G.forgeMode=true;G.screen='forge';render();}
function vForge(){const cards=G.deck.map((id,i)=>{const canUp=!CARDS[id].up&&CARDS[id+'+'];const price=canUp?20+CARDS[id].cost*5:0;const afford=G.gold>=price;const dis=!canUp||!afford;return `<div class="forge-card ${dis?'dis':''}" ${dis?'':`onclick="upgradeCard(${i})"`}>${cardHTML(id,{attr:'style="cursor:pointer;pointer-events:none"'})}${canUp?`<div style="font-size:9px;text-align:center;color:${afford?'#ffcc33':'#5a3a3a'}">${price} 金</div>`:`<div style="font-size:9px;text-align:center;color:#3a7a3a">已升级</div>`}</div>`;}).join('');return `<div class="screen event"><h2>🔨 铁 匠 铺</h2><p>花费金币升级一张卡牌（最高 2 级）</p><p style="font-size:11px">当前金币：<span style="color:#ffcc33">${G.gold}</span></p><div class="forge-wrap">${cards}</div><button class="btn" onclick="toMap()">离开铁匠铺 ▶</button></div>`;}
function upgradeCard(idx){const id=G.deck[idx];if(!id)return;if(CARDS[id].up||!CARDS[id+'+'])return;const price=20+CARDS[id].cost*5;if(G.gold<price)return;G.gold-=price;G.deck[idx]=id+'+';render();}

function doEventNode(){const keys=Object.keys(EVENT_DEFS);G.eventKey=pick(keys);G.eventResult=null;G.screen='event';render();}
function vEvent(){const ev=EVENT_DEFS[G.eventKey];if(!ev)return '<div class="screen event"><p>无事件</p></div>';if(G.eventResult){return `<div class="screen event"><h2>${ev.icon==='skull'?'💀':'✨'} ${ev.name}</h2><p>${ev.desc}</p><p class="${G.eventResult.ok?'good':'bad'}">${G.eventResult.text}</p><button class="btn gold" onclick="toMap()">继续前进 ▶</button></div>`;}return `<div class="screen event"><h2>${ev.name}</h2>${spr(ev.icon,4)}<p>${ev.desc}</p><button class="btn gold" onclick="triggerEvent()">接受</button></div>`;}
function triggerEvent(){const ev=EVENT_DEFS[G.eventKey];G.eventResult=ev.act();if(G.hp<=0){G.hp=0;G.screen='over';render();return;}render();}

function vOver(){return `<div class="screen event"><h2 style="color:#e05a5a">☠ 你 倒 下 了 ☠</h2>${spr('skel',6)}<p>雷霆之路又多了一具白骨……</p><button class="btn gold" onclick="startRun()">重新开始</button></div>`;}
function startRun(){showCharSelect();}
function vWin(){return `<div class="screen event"><h2 style="color:#8ef08e">★ 通 关 胜 利 ★</h2>${spr('hero',7)}<p class="good">你击败了${CHAPTERS[G.chapter].name}的最终Boss！</p><p>等级 ${G.level}　剩余生命 ${G.hp}/${G.maxHp}　金币 ${G.gold}</p><button class="btn gold" onclick="startRun()">再玩一次</button></div>`;}

newGame();render();
</script>
</body>
</html>
