<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:#06060b;color:#e8e8f0;font-family:"Courier New",Consolas,monospace;font-weight:bold;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;touch-action:none}
#game{width:min(1000px,100vw);height:min(710px,100vh);background:#12121c;border:4px solid #262640;box-shadow:0 0 0 4px #06060b,0 0 40px #000;position:relative;overflow:hidden;display:flex;flex-direction:column}

.bar>i.hp{background:linear-gradient(#e05a5a,#8a1a1a)}

.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#1c1c34 0%,#08080f 75%);position:relative;overflow:hidden}

.chargender{font-size:10px;color:#8ef08e;text-align:center;letter-spacing:1px}

.topbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#181826;border-bottom:3px solid #262640;flex:0 0 auto}

.coinbox{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:12px;color:#ffcc33}

.battle-wrap{flex:1;display:flex;min-height:0;overflow:hidden}

.card .cost{position:absolute;top:-8px;left:-8px;width:22px;height:22px;background:#ffcc33;color:#1a1200;border:3px solid #6a5220;display:flex;align-items:center;justify-content:center;font-size:11px}

.card .art{display:flex;justify-content:center;margin:7px 0 2px}
.card .cname{font-size:10px;text-align:center;color:#fff;letter-spacing:1px;margin-bottom:2px}
.card.up .cname{color:#ffcc33}
.card .cdesc{font-size:8px;color:#9a9ac0;text-align:center;line-height:1.3;flex:1;display:flex;align-items:center;justify-content:center;padding:0 2px}
.float-text{position:fixed;transform:translate(-50%,-50%);font-size:20px;font-weight:bold;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none;z-index:10000;animation:fup .9s ease-out forwards}

<body>
<div id="game"></div>
<script>
function shade(hex,amt){const num=parseInt(hex.slice(1),16);let r=Math.max(0,Math.min(255,(num>>16)+amt));let g=Math.max(0,Math.min(255,((num>>8)&0xff)+amt));let b=Math.max(0,Math.min(255,(num&0xff)+amt));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
let uid=0;
const HAND_LIMIT=9;

function spr(key,scale){const s=SPR[key];if(!s)return '';const h=s.r.length,w=s.r[0].length;let out=`<div class="sprite" style="width:${w*scale}px;height:${h*scale}px">`;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=s.p[s.r[y][x]];if(c)out+=`<b style="left:${x*scale}px;top:${y*scale}px;width:${scale}px;height:${scale}px;background:${c}"></b>`;}return out+'</div>';}
function potionSpr(main,scale){const d=shade(main,-70),l=shade(main,50);const rows=['..dddd..','..d..d..','..d..d..','.dllllld','dllllllmd','dlllllmmd','dmmmmmmd','dmmmmmmd','.dmmmmd.','..dddd..'];const pal={d,l,m:main};let out=`<div class="sprite" style="width:${8*scale}px;height:${10*scale}px">`;for(let y=0;y<rows.length;y++)for(let x=0;x<8;x++){const c=pal[rows[y][x]];if(c)out+=`<b style="left:${x*scale}px;top:${y*scale}px;width:${scale}px;height:${scale}px;background:${c}"></b>`;}return out+'</div>';}

/* ===== 扩展：30 种新小怪贴图（复用既有图案 + 独立配色）===== */
(function(){
  const bases=['slime','bat','skel','gob','ghost','shroom','cactus','scarab','mirror','vulture','sandGolem','mage','gargoyle','elemental','mechBird','guardian','curseMage','clockwork','skyKnight','bindMage','treant','thornVine','carnivorous','sandworm','mummy','bandit','sandSpirit','sunPriest','sentry','colossus'];
  const palettes=[
    ['#7ad0ff','#2a5a8a','#e0f4ff'],['#ff8a4a','#8a2a0a','#ffe0a0'],['#a0e060','#2a5a0a','#f0ffc0'],
    ['#c05aff','#4a0a7a','#f0d0ff'],['#ff5a8a','#7a0a2a','#ffd0e0'],['#5ae0d0','#0a5a4a','#d0fff8'],
    ['#ffd75a','#8a6a0a','#fff8d0'],['#8a8aff','#2a2a8a','#e0e0ff'],['#c0c0c0','#4a4a4a','#ffffff'],
    ['#ff6a3a','#6a1a0a','#ffc0a0']
  ];
  bases.forEach((b,i)=>{
    const base=SPR[b]; if(!base) return;
    const pal=palettes[i%palettes.length];
    const keys=Object.keys(base.p);
    const np={};
    keys.forEach((k,ki)=>{ np[k]=pal[ki%pal.length]; });
    SPR['x'+(i+1)]={p:np,r:base.r};
  });
})();

let G=null;let drag=null;
const BASE_MAP=[[2],[1,2,3],[0,1,3,4],[1,2,3],[0,1,3,4],[1,2,3],[0,1,3,4],[1,2,3],[0,1,3,4],[1,2,3],[2]];
/* 地图加深 4 格：在 BOSS 前多接 4 层中间过道（保证每层都与下一层连通） */
const MAP_PATTERN=(()=>{
  const p=BASE_MAP.slice(0,-1);
  for(let i=0;i<4;i++)p.push(i%2===0?[1,2,3]:[0,1,3,4]);
  p.push([2]);
  /* 修复死路：如果某层某列在下一层找不到相邻列，就把它剔掉（总有 1~3 相连） */
  for(let r=0;r<p.length-1;r++){
    const nxt=p[r+1];
    const kept=p[r].filter(c=>nxt.some(n=>Math.abs(n-c)<=1));
    if(kept.length)p[r]=kept;
  }
  return p;
})();
function genMap(){const rows=MAP_PATTERN.length;const TYPES=['battle','battle','battle','elite','chest','shop','rest','adventure','stone','forge','event'];return MAP_PATTERN.map((cols,r)=>cols.map(c=>{if(r===rows-1)return{col:c,type:'boss'};if(r===0)return{col:c,type:'battle'};return{col:c,type:pick(TYPES)};}));}

function newGame(){G={screen:'title',hp:20,maxHp:20,gold:0,maxEnergy:3,extraDraw:0,level:1,exp:0,expNeeded:1,character:null,chapter:0,deck:[],items:[],map:[],pos:-1,chosen:[],battle:null,extra:{},shopStock:[],advOptions:[],blessingOptions:[],chestOptions:[],stone:{mode:null,selected:[]},shopRecycleUsed:false,shopRecycleMode:false,forgeMode:false,eventResult:null,eventKey:null,swordCount:0,deckOpen:false};}

function render(){
  const el=document.getElementById('game');
  let html='';
  switch(G.screen){case 'title':html=vTitle();break;case 'charSelect':html=vCharSelect();break;case 'blessing':html=vBlessing();break;case 'battle':html=vBattle();break;case 'map':html=vMap();break;case 'reward':html=vReward();break;case 'chest':html=vChest();break;case 'shop':html=vShop();break;case 'rest':html=vRest();break;case 'adventure':html=vAdventure();break;case 'stone':html=vStone();break;case 'forge':html=vForge();break;case 'levelup':html=vLevelUp();break;case 'event':html=vEvent();break;case 'over':html=vOver();break;case 'win':html=vWin();break;}
  el.innerHTML=html;
  if(G.battle&&G.battle.newDrawUids)G.battle.newDrawUids=[];
}

function cardHTML(id,opts){opts=opts||{};const c=CARDS[id];if(!c)return '';const cls=['card',c.up?'up':'',(c.exhaust||c.countdown)?'exhaust':'',c.retain?'retain':'',c.revengeCard?'revenge':'',opts.entangled?'entangled':'',opts.disabled?'no':'',opts.cls||''].join(' ');const actualCost=opts.costOverride!==undefined?opts.costOverride:c.cost;const costCls=['cost',actualCost===0?'free':''].join(' ');return `<div class="${cls}" ${opts.attr||''}><div class="${costCls}">${actualCost}</div><div class="art">${spr(c.icon,3)}</div><div class="cname">${c.name}</div><div class="cdesc">${c.desc}</div></div>`;}

function itemSlotHTML(idx,small){const id=G.items[idx];if(id===undefined)return `<div class="item-slot empty"></div>`;const it=ITEMS[id];const noUse=it.use==='none';return `<div class="item-slot ${noUse?'no-use':''}" ${noUse?'':`onclick="useItem(${idx})"`}>${itemIcon(id,small?2:2)}<div class="itip"><b>${it.name}</b>${it.desc}</div></div>`;}

function vTitle(){return `<div class="screen title"><div style="position:absolute;top:18px;right:40px;opacity:.9">${spr('star',4)}</div><div style="transform:scale(.92);filter:drop-shadow(0 6px 0 #050508)">${spr('tower',5)}</div><h1>雷霆卡牌</h1><div class="sub">— 雷 霆 三 篇 章 —</div><button class="btn gold" style="font-size:15px;padding:12px 32px;margin-top:6px" onclick="showCharSelect()">开 始 远 征</button><div style="font-size:10px;color:#44446a;margin-top:4px">拖动攻击牌到怪物身上 · 点击其他牌使用</div></div>`;}
function showCharSelect(){newGame();G.screen='charSelect';render();}
function vCharSelect(){const chars=Object.keys(CHARACTERS);const cards=chars.map(id=>{const c=CHARACTERS[id];return `<div class="charcard" onclick="chooseChar('${id}')">${spr(c.icon,4)}<div class="charname">${c.name}</div><div class="chargender">初始能量 3</div><div class="chardesc">${c.desc}</div><div class="charskill">技能：${c.skill}</div></div>`;}).join('');return `<div class="screen event"><h2>⚔ 选 择 角 色 ⚔</h2><p>四位冒险者，你选谁？</p><div class="chargrid">${cards}</div></div>`;}
function chooseChar(id){const c=CHARACTERS[id];G.character=id;G.deck=c.initialDeck.slice();G.blessingOptions=shuffle(BLESSINGS).slice(0,3);G.screen='blessing';render();}
function vBlessing(){const opts=G.blessingOptions.map((b,i)=>`<div class="blesscard" onclick="chooseBlessing(${i})">${spr(b.icon,4)}<div class="blessname">${b.name}</div><div class="blessdesc">${b.desc}</div></div>`).join('');return `<div class="screen event"><h2>✨ 选 择 祝 福 ✨</h2><p>在远征开始前，选择一项祝福</p><div class="blessgrid">${opts}</div></div>`;}
function chooseBlessing(i){const b=G.blessingOptions[i];if(!b)return;b.apply();G.screen='map';G.chapter=0;G.map=genMap();G.pos=-1;G.chosen=[];render();}

const ROW_H=78;const VIEW_H=420;
function isReachable(row,col){if(row!==G.pos+1)return false;if(G.pos===-1)return true;const prevCol=G.chosen[G.pos];if(prevCol===undefined)return true;
  /* 与上一格相邻才算连通；找不到时退一步：只要本层存在就允许（防死路） */
  if(Math.abs(col-prevCol)<=1)return true;
  const cur=G.map[row]||[];
  return cur.length>0&&!cur.some(n=>Math.abs(n.col-prevCol)<=1);
}

function vMap(){
  const chapter=CHAPTERS[G.chapter];
  const rows=G.map.length;
  const totalH=rows*ROW_H;
  const innerTop=Math.max(0,Math.min(totalH-VIEW_H,G.pos*ROW_H-VIEW_H/2+ROW_H/2));
  let lines='',nodes='';
  for(let r=0;r<rows-1;r++){for(const a of G.map[r]){for(const b of G.map[r+1]){if(Math.abs(a.col-b.col)>1)continue;const x1=(a.col+0.5)/5*100,y1=(r+0.5)*ROW_H;const x2=(b.col+0.5)/5*100,y2=(r+1.5)*ROW_H;const used=G.chosen[r]===a.col&&G.chosen[r+1]===b.col&&r<G.pos;lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${used?'#ffcc33':'#20203a'}" stroke-width="2" vector-effect="non-scaling-stroke" ${used?'':'stroke-dasharray="4 5"'}/>`;}}}
  for(let r=0;r<rows;r++){for(const n of G.map[r]){const x=(n.col+0.5)/5*100,y=(r+0.5)*ROW_H;const avail=isReachable(r,n.col);const done=(r<=G.pos);const locked=(r===G.pos+1&&!avail);const cls=['mnode',n.type,avail?'avail':'',done?'done':'',locked?'locked':''].join(' ');nodes+=`<div class="${cls}" style="left:${x}%;top:${y}px" ${avail?`onclick="enterNode(${r},${n.col})"`:''}><div class="mi">${spr(NODE_ICON[n.type]||'star',2)}</div><div class="ml">${NODE_NAME[n.type]||'?'}</div></div>`;}}
  let itemsHTML='';for(let i=0;i<3;i++)itemsHTML+=itemSlotHTML(i,true);
  const bgMap={forest:'repeating-linear-gradient(90deg,transparent 0 38px,rgba(20,50,20,.25) 38px 40px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(20,50,20,.18) 30px 32px),linear-gradient(#0a140c,#0e1a10)',desert:'repeating-linear-gradient(90deg,transparent 0 38px,rgba(60,40,20,.25) 38px 40px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(60,40,20,.18) 30px 32px),linear-gradient(#1a0e04,#2a1a0a)',tower:'repeating-linear-gradient(90deg,transparent 0 38px,rgba(20,30,60,.25) 38px 40px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(20,30,60,.18) 30px 32px),linear-gradient(#060a18,#0e1424)'};
  const deckOverlay=G.deckOpen?renderDeckOverlay():'';
  return `<div class="screen" style="position:relative">
    <div class="topbar"><span class="lbl">HP</span><div class="bar"><i class="hp" style="width:${G.hp/G.maxHp*100}%"></i><span>${G.hp}/${G.maxHp}</span></div><div class="lvbox">Lv.${G.level} (${G.exp}/${G.expNeeded})</div><div class="coinbox">${spr('coin',2)} ${G.gold}</div></div>
    <div class="mapitems"><span class="ilabel">道具：</span>${itemsHTML}
      <button class="btn" style="margin-left:auto;padding:4px 10px;font-size:10px;box-shadow:0 2px 0 #06060b" onclick="showDeckView()">📚 牌库 (${G.deck.length})</button>
    </div>
    <div class="maphead">第 ${G.chapter+1} 章 · ${chapter.name}</div>
    <div class="mapwrap" style="height:${VIEW_H}px;background:${bgMap[chapter.theme]}">
      <div class="map-inner" style="height:${totalH}px;transform:translateY(${-innerTop}px)">
        <svg viewBox="0 0 100 ${totalH}" preserveAspectRatio="none" style="height:${totalH}px">${lines}</svg>
        ${nodes}
      </div>
    </div>
    ${deckOverlay}
  </div>`;
}

function renderDeckOverlay(){
  const sorted=[...G.deck].sort();
  const cards=sorted.map(id=>`<div>${cardHTML(id,{})}</div>`).join('');
  return `<div class="deck-overlay" onclick="if(event.target===this)closeDeckView()">
    <div class="hd"><h2>📚 牌库（${G.deck.length} 张）</h2><button class="btn gold" onclick="closeDeckView()">关闭 ✕</button></div>
    <div class="grid">${cards||'<div style="color:#5a5a7a">牌库为空</div>'}</div>
  </div>`;
}
function showDeckView(){G.deckOpen=true;render();}
function closeDeckView(){G.deckOpen=false;render();}

const NODE_ICON={battle:'sword',elite:'elite',chest:'chest',shop:'shop',rest:'fire',boss:'skull',adventure:'star',stone:'skull',forge:'hammer',event:'star'};
const NODE_NAME={battle:'战斗',elite:'精英',chest:'宝箱',shop:'商店',rest:'休息',boss:'BOSS',adventure:'奇遇',stone:'怪石',forge:'铁匠铺',event:'事件'};

function enterNode(row,col){if(!isReachable(row,col))return;G.pos=row;G.chosen[row]=col;const node=G.map[row].find(n=>n.col===col);if(!node)return;if(node.type==='battle')startBattle(false,false);else if(node.type==='elite')startBattle(false,true);else if(node.type==='boss')startBattle(true,false);else if(node.type==='chest')doChest();else if(node.type==='shop')doShop();else if(node.type==='rest')doRest();else if(node.type==='adventure')doAdventure();else if(node.type==='stone')doStone();else if(node.type==='forge')doForge();else if(node.type==='event')doEventNode();}

function makeEnemyFromDef(key,def,scale){const e={id:uid++,key,name:def.name,hp:Math.max(3,Math.round(def.hp*scale)),maxHp:0,shield:0,poison:0,weakness:0,stunned:false,dmgMin:Math.max(1,Math.round(def.dmgMin*scale)),dmgMax:Math.max(1,Math.round(def.dmgMax*scale)),def:Math.round(def.def*scale),spr:def.spr,canSplit:!!def.split,thorns:def.thorns||0,weakOnHit:def.weaknessOnHit||0,poisonOnHit:def.poisonOnHit||0,entangleOnHit:def.entangleOnHit||0,revive:!!def.revive,dodge:def.dodge||0,drain:def.drain||0,healsAllies:!!def.healsAllies,summon:!!def.summon,weakDebuff:def.weakDebuff||0,poisonDebuff:def.poisonDebuff||0,entangleDebuff:def.entangleDebuff||0,multiHit:def.multiHit||0,discardAttack:def.discardAttack||0,curseAttack:def.curseAttack||0,bombTimer:def.bombTimer||0,transferDebuff:def.transferDebuff||0,bossCharge:def.bossCharge||0,enrage:def.enrage||0,poisonAura:def.poisonAura||0,weakAura:def.weakAura||0,thornsGrow:def.thornsGrow||0,stealGold:def.stealGold||0,shieldUp:def.shieldUp||0,deathBlast:def.deathBlast||0,deathCurse:def.deathCurse||0,charging:false,bombArmed:false,bombLeft:0,intent:null,elite:false,boss:false};e.maxHp=e.hp;return e;}
function makeSlimeS(){return{id:uid++,key:'slimeS',name:'小史莱姆',hp:4,maxHp:4,shield:0,poison:0,weakness:0,stunned:true,dmgMin:1,dmgMax:2,def:1,spr:'slimeS',canSplit:false,intent:null,elite:false,boss:false,thorns:0,weakOnHit:0,poisonOnHit:0,entangleOnHit:0,revive:false,dodge:0,drain:0,healsAllies:false,summon:false,weakDebuff:0,poisonDebuff:0,entangleDebuff:0};}
function rollEnemyCount(){const r=rnd(100);if(r<50)return 2;if(r<80)return 3;if(r<95)return 4;return 5;}

function startBattle(isBoss,isElite){const chapter=CHAPTERS[G.chapter];const progress=G.map.length>1?G.pos/(G.map.length-1):0;/* 怪物强度：基础略降，但成长曲线拉高（每层+0.85、每章×0.75）
   旧：(1.00+prog*0.55)*(1+ch*0.38) —— 每层只 +0.039，几乎不动
   新：每层 +0.85（15 层从 1.00 → 1.85），每章再 ×1.75 */
const scale=(1.00+progress*0.85)*(1+G.chapter*0.75);const enemies=[];if(isBoss){const bossKey=pick(chapter.bosses);const e=makeEnemyFromDef(bossKey,BOSS_DEFS[bossKey],scale*1.2);e.boss=true;enemies.push(e);}else if(isElite){const n=Math.random()<0.5?1:2;for(let i=0;i<n;i++){const ek=pick(chapter.elites);const e=makeEnemyFromDef(ek,ELITE_DEFS[ek],scale);e.elite=true;enemies.push(e);}}else{const n=rollEnemyCount();const countScale=n===2?1:n===3?0.85:n===4?0.72:0.62;for(let i=0;i<n;i++){const ek=pick(chapter.enemies);const e=makeEnemyFromDef(ek,ENEMY_DEFS[ek],scale*countScale);enemies.push(e);}}G.battle={enemies,drawPile:shuffle(G.deck),discardPile:[],hand:[],energy:0,maxEnergy:G.maxEnergy,shield:0,atkBuff:G.atkBuff||0,thorns:0,rageBonus:0,doubleNext:false,countdowns:[],shieldNextTurn:0,dmgTaken:0,pendingDiscard:0,pendingEntangle:0,costReduce:0,venomCoat:0,echoEnergy:0,overloadDmg:0,playerWeakness:0,playerPoison:0,playerEntangle:0,magic:false,magicCount:{},attackPlayedThisTurn:false,cardsPlayedThisTurn:0,nextTurnBuff:0,extraEnergyNextTurn:0,regenPending:0,echoHealPerPlay:0,drawPenaltyNext:0,pendingDoom:0,rebirth:false,rebirthUsed:false,revengeCount:0,newDrawUids:[],turn:0,busy:false,over:false,isBoss,isElite,revived:new Set(),log:[]};G.screen='battle';addLog('—— 战斗开始 ——','#ffcc33');startPlayerTurn();}
function addLog(text,col){if(!G||!G.battle)return;G.battle.log.push({text,col:col||'#a0a0c0'});if(G.battle.log.length>30)G.battle.log.shift();}

function takeFromDiscardByType(type){
  const b=G.battle;
  for(let i=b.discardPile.length-1;i>=0;i--){
    const id=b.discardPile[i];
    if(CARDS[id].type===type){b.discardPile.splice(i,1);return id;}
  }
  return null;
}
function addCardToHand(id){
  const b=G.battle;
  if(b.hand.length>=HAND_LIMIT){b.discardPile.push(id);showWarnAnim('手牌上限已满');return false;}
  const h={uid:uid++,id,tempCost:null,entangled:false};b.hand.push(h);b.newDrawUids.push(h.uid);return true;
}

/* ===== 修复缠绕：玩家回合开始时，无论手牌是否为空都清零 playerEntangle ===== */
function startPlayerTurn(){
  const b=G.battle;b.turn++;b.energy=b.maxEnergy;b.busy=false;b.rageBonus=0;b.doubleNext=false;b.attackPlayedThisTurn=false;b.cardsPlayedThisTurn=0;
  b.thornLocked=false;   /* 新回合：荆棘锁定解除（层数本身不补充） */
  /* 解锁上回合被缠绕的牌（缠绕只持续一个回合）——必须最先做，
     否则会把本回合刚锁上的牌又解开 */
  b.hand.forEach(h=>h.entangled=false);

  /* ===== ① 系统补牌：优先级最高，必须在任何「会抽牌的效果」之前结算 =====
     否则倒计时/技能先抽牌，会把手牌顶到 5 张，导致这里的 needDraw 变成 0，
     本该补的牌（含 drawBonusNext 奖励）就被吞掉了。 */
  const targetHand=Math.max(0,5+(G.extraDraw||0)-(b.drawPenaltyNext||0)+(b.drawBonusNext||0));
  b.drawBonusNext=0;
  b.drawPenaltyNext=0;
  const needDraw=Math.max(0,targetHand-b.hand.length);
  if(needDraw>0)drawCards(needDraw);

  /* ③ 结算上回合怪物留下的「弃牌」「缠绕」——必须在抽完牌之后，
        这样打落/锁住的才是你这回合真正拿到的手牌 */
  if(b.pendingDiscard>0){
    let n=0;
    for(let i=0;i<b.pendingDiscard;i++){
      const cand=b.hand.filter(h=>!h.entangled);
      if(!cand.length)break;
      const h=cand[rnd(cand.length)];
      const hi=b.hand.indexOf(h);
      if(hi>=0){b.hand.splice(hi,1);b.discardPile.push(h.id);n++;}
    }
    addLog(`怪物打落了你 ${n} 张手牌`,'#c080ff');
    if(n>0)showWarnAnim('手牌被打落！');
    b.pendingDiscard=0;
  }
  if(b.pendingEntangle>0){
    const lockCount=Math.min(b.pendingEntangle,b.hand.length);
    if(lockCount>0){
      const idxs=shuffle([...Array(b.hand.length).keys()]).slice(0,lockCount);
      idxs.forEach(i=>b.hand[i].entangled=true);
      addLog(`缠绕锁定了 ${lockCount} 张手牌（本回合）`,'#ffa0e0');
    }
    b.pendingEntangle=0;
  }

  /* ② 倒计时推进（可能抽牌、造成伤害，都在系统补牌之后） */
  if(b.countdowns&&b.countdowns.length){
    const due=[];
    for(const c of b.countdowns){c.left--;if(c.left<=0)due.push(c);}
    b.countdowns=b.countdowns.filter(c=>c.left>0);
    for(const c of due){
      triggerCountdown(c,b);
      if(b.over)return;
      checkDeaths();
      if(b.enemies.length===0)return;
    }
  }
  /* 稳如磐石：下回合开始追加护盾 */
  if(b.shieldNextTurn>0){b.shield+=b.shieldNextTurn;addLog(`护盾延展：+${b.shieldNextTurn} 护盾`,'#80b0ff');b.shieldNextTurn=0;}
  b.costReduce=0;b.venomCoat=0;b.echoEnergy=0;   /* 回合限定的临时效果 */
  if(b.nextTurnBuff>0){b.rageBonus+=b.nextTurnBuff;b.nextTurnBuff=0;}
  if(b.extraEnergyNextTurn>0){b.energy+=b.extraEnergyNextTurn;b.extraEnergyNextTurn=0;}
  b.newDrawUids=[];
  if(CHARACTERS[G.character].skillType==='tallShield'){
    b.shield+=4;
    addLog('高人：回合开始获得 4 点护盾','#80b0ff');
  }
  if(b.regenPending>0){
    const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+b.regenPending);
    addLog(`再生之种：回复 ${G.hp-before} 点生命`,'#7ce87c');
    b.regenPending=0;
  }
  if(b.pendingDoom>0){
    b.pendingDoom--;
    if(b.pendingDoom===0){
      addLog('末日预言降临！全体受到30伤害','#ff6060');
      for(const e of b.enemies){e.hp-=30;}
      checkDeaths();
      if(b.over)return;
    }else{addLog(`末日预言还需 ${b.pendingDoom} 回合`,'#ff8080');}
  }
  b.enemies.forEach(e=>{
    e.weakness=0;e.thornLocked=false;
    if(e.stunned)e.intent=null;
    else if(e.charging){
      /* 蓄力中：intent 由 charge → heavy attack 自行推进，绝不重掷，
         否则会丢掉蓄力伤害（这正是之前「新旧意图一起算」的根因） */
    }
    else e.intent=rollIntent(e);
  });
  addLog(`—— 第 ${b.turn} 回合 ——`,'#8a8ab0');
  render();
}

function atkVal(e){return e.dmgMin+rnd(e.dmgMax-e.dmgMin+1);}

/* 怪物意图池：每种怪按自身特性挑选，不再是「攻击/防御」二选一 */
function rollIntent(e){
  const R=Math.random();
  /* 1) 专属负面 */
  if(e.entangleDebuff&&R<0.15)return{type:'debuff',effect:'entangle',value:e.entangleDebuff};
  if(e.weakDebuff&&R<0.30)return{type:'debuff',effect:'weak',value:e.weakDebuff};
  if(e.poisonDebuff&&R<0.30)return{type:'debuff',effect:'poison',value:e.poisonDebuff};
  if(e.healsAllies&&R<0.35)return{type:'heal',value:4};

  /* 2) BOSS 专属花样（放在最前，权重高） */
  if(e.boss){
    const r=Math.random();
    if(!e.charging&&r<0.18){e.charging=true;return{type:'charge',value:Math.round(atkVal(e)*2.4),turns:1};}
    if(r<0.30&&G.battle&&G.battle.enemies.length<4)return{type:'summon',value:1};
    if(r<0.42)return{type:'curse',value:2};
    if(r<0.52)return{type:'discard',value:1};
    if(r<0.62)return{type:'debuff',effect:'poison',value:3};
    if(r<0.72)return{type:'buff',effect:'attack',value:2};
    if(r<0.82)return{type:'buff',effect:'shield',value:Math.ceil(e.def*1.8)};
    if(r<0.90)return{type:'multi',hits:[Math.round(atkVal(e)*0.6),Math.round(atkVal(e)*0.6)],value:atkVal(e)};
  }
  /* 精英蓄力 */
  if(e.elite&&!e.charging&&Math.random()<(e.chargeBias?0.32:0.16)){e.charging=true;return{type:'charge',value:Math.round(atkVal(e)*2.2),turns:1};}

  /* 3) 多段攻击：速度快/带爪牙的怪 */
  if(e.multiHit&&Math.random()<0.45){
    const n=e.multiHit;let tot=0;const hits=[];
    for(let i=0;i<n;i++){const v=Math.max(1,Math.round(atkVal(e)/n));hits.push(v);tot+=v;}
    return{type:'multi',hits:hits,value:tot};
  }

  /* 4) 偷牌：把玩家手牌塞进弃牌堆（手牌少时不偷，避免卡死） */
  if(e.discardAttack&&Math.random()<0.30)return{type:'discard',value:e.discardAttack};

  /* 5) 塞诅咒牌（往牌库里塞无用牌） */
  if(e.curseAttack&&Math.random()<0.25)return{type:'curse',value:e.curseAttack};

  /* 6) 吸血攻击 */
  if(e.drain&&Math.random()<0.3)return{type:'attack',value:atkVal(e),lifesteal:true};

  /* 7) 自爆倒计时：3 回合后对玩家造成大量伤害 */
  if(e.bombTimer&&Math.random()<0.3&&!e.bombArmed){
    e.bombArmed=true;e.bombLeft=e.bombTimer;
    return{type:'arm',value:e.bombTimer};
  }

  /* 8) 召唤帮手（BOSS / 召唤型） */
  if((e.boss||e.summon)&&Math.random()<0.2&&G.battle&&G.battle.enemies.length<4)
    return{type:'summon',value:1};

  /* 9) 转移负面给你（把自身中毒/虚弱转嫁） */
  if(e.transferDebuff&&Math.random()<0.25)return{type:'transfer',value:1};

  /* 10) BOSS 强化（加攻击力，而不是只加盾） */
  if(e.boss&&Math.random()<0.35){
    if(Math.random()<0.5)return{type:'buff',effect:'attack',value:2};
    return{type:'buff',effect:'shield',value:Math.ceil(e.def*1.5)};
  }

  if(Math.random()<0.25)return{type:'defend',value:e.def};
  return{type:'attack',value:atkVal(e)};
}

function drawCards(n){
  const b=G.battle;
  if(!b.newDrawUids)b.newDrawUids=[];
  let overflowWarned=false;
  for(let i=0;i<n;i++){
    if(b.drawPile.length===0){
      if(b.discardPile.length===0)break;
      b.drawPile=shuffle(b.discardPile);b.discardPile=[];
      addLog('牌库耗尽，弃牌堆已洗回牌库','#8a8ab0');
      showShuffleAnim();
    }
    const id=b.drawPile.pop();
    if(b.hand.length>=HAND_LIMIT){
      b.discardPile.push(id);
      if(!overflowWarned){showWarnAnim('手牌上限已满（9张），多余的牌被弃置');overflowWarned=true;}
      continue;
    }
    const h={uid:uid++,id,tempCost:null,entangled:false};b.hand.push(h);b.newDrawUids.push(h.uid);
  }
}

function showShuffleAnim(){const el=document.createElement('div');el.className='shuffle-anim';el.textContent='🔀 弃牌堆洗回牌库';document.body.appendChild(el);setTimeout(()=>el.remove(),900);}
function showWarnAnim(msg){const el=document.createElement('div');el.className='warn-anim';el.textContent='⚠ '+msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1200);}

function getBattleBuffs(){
  const b=G.battle;if(!b)return [];
  const arr=[];
  if(b.rageBonus>0)arr.push({icon:'⚔',val:'+'+b.rageBonus,color:'#ffcc33',tip:'本回合攻击 +'+b.rageBonus});
  if(b.atkBuff>0)arr.push({icon:'💪',val:'+'+b.atkBuff,color:'#ff9a3a',tip:'本场战斗攻击 +'+b.atkBuff});
  if(b.thorns>0)arr.push({icon:'🌵',val:b.thorns,color:'#ffaa40',tip:'荆棘 '+b.thorns+' 层（受击反伤，逐层消耗）'});
  if(b.countdowns&&b.countdowns.length)for(const c of b.countdowns)arr.push({icon:'⏳',val:c.left,color:'#c080ff',tip:c.name+'：还有 '+c.left+' 回合发动'});
  if(b.nextTurnBuff>0)arr.push({icon:'⏭',val:'+'+b.nextTurnBuff,color:'#c080ff',tip:'下回合攻击 +'+b.nextTurnBuff});
  if(b.extraEnergyNextTurn>0)arr.push({icon:'⚡',val:'+'+b.extraEnergyNextTurn,color:'#ffd75a',tip:'下回合能量 +'+b.extraEnergyNextTurn});
  if(b.doubleNext)arr.push({icon:'×2',val:'',color:'#ff6060',tip:'下张攻击牌生效两次'});
  if(b.magic)arr.push({icon:'✨',val:'',color:'#c080ff',tip:'魔术：同名牌用2次复制0费版'});
  if(b.rebirth&&!b.rebirthUsed)arr.push({icon:'💫',val:'',color:'#ffcc33',tip:'可复活一次'});
  if(b.pendingDoom>0)arr.push({icon:'💀',val:b.pendingDoom,color:'#ff6060',tip:'末日预言倒计时 '+b.pendingDoom});
  if(b.regenPending>0)arr.push({icon:'💚',val:'+'+b.regenPending,color:'#7ce87c',tip:'下回合开始回 '+b.regenPending+' 血'});
  if(b.echoHealPerPlay>0)arr.push({icon:'♻',val:'+'+b.echoHealPerPlay,color:'#80e0ff',tip:'每出一张牌回 '+b.echoHealPerPlay+' 血'});
  if(b.drawPenaltyNext>0)arr.push({icon:'🚫',val:'-'+b.drawPenaltyNext,color:'#8a8a9a',tip:'下回合少抽 '+b.drawPenaltyNext+' 张'});
  if(b.revengeCount>0)arr.push({icon:'🔁',val:b.revengeCount+'/2',color:'#ff6060',tip:'复仇打击计数 '+b.revengeCount+'/2（满2复制）'});
  return arr;
}

function vBattle(){
  const b=G.battle;
  const chapter=CHAPTERS[G.chapter];
  const charIcon=CHARACTERS[G.character||'warrior'].icon;
  const enemiesHTML=b.enemies.map((e,i)=>{const it=e.intent;let itHTML='';if(e.stunned)itHTML=`<div class="intent stun">💫 眩晕</div>`;else if(it){if(it.type==='attack')itHTML=`<div class="intent atk">攻 ${it.value}${e.weakness>0?`-${e.weakness}`:''}</div>`;else if(it.type==='defend')itHTML=`<div class="intent def">防 ${it.value}</div>`;else if(it.type==='debuff'){const name=it.effect==='entangle'?'缠绕':it.effect==='weak'?'虚弱':'中毒';itHTML=`<div class="intent debuff">🌀 ${name}${it.value}</div>`;}else if(it.type==='heal')itHTML=`<div class="intent heal">💚 治疗</div>`;else if(it.type==='buff')itHTML=`<div class="intent buff">✨ ${it.effect==='attack'?'狂暴':'强化'}</div>`;
        else if(it.type==='charge')itHTML=`<div class="intent atk" style="border-color:#ff3030">⚡ 蓄力 ${it.value}</div>`;
        else if(it.type==='multi')itHTML=`<div class="intent atk">攻 ${it.hits.join('+')}</div>`;
        else if(it.type==='discard')itHTML=`<div class="intent debuff">🃏 弃牌</div>`;
        else if(it.type==='curse')itHTML=`<div class="intent debuff">📜 塞诅咒</div>`;
        else if(it.type==='arm')itHTML=`<div class="intent debuff" style="border-color:#ff5050">💣 ${it.value}回合</div>`;
        else if(it.type==='summon')itHTML=`<div class="intent buff">👥 召唤</div>`;
        else if(it.type==='transfer')itHTML=`<div class="intent debuff">🌀 转嫁</div>`;}const pct=Math.max(0,e.hp/e.maxHp*100);const status=[];if(e.poison>0)status.push('毒'+e.poison);if(e.shield>0)status.push('盾'+e.shield);if(e.weakness>0)status.push('弱'+e.weakness);if(e.thorns>0)status.push('棘'+e.thorns);if(e.revive)status.push('复');const stStr=status.length?` <span style="color:#a0e0a0">[${status.join(' ')}]</span>`:'';return `<div class="enemy ${e.elite?'elite':''} ${e.boss?'boss':''}" data-enemy-idx="${i}" data-uid="${e.id}">${itHTML}<div class="sbox">${spr(e.spr,e.boss?6:5)}</div><div class="ename">${e.boss?'👑 ':e.elite?'★ ':''}${e.name}${stStr}</div><div class="bar"><i class="ehp" style="width:${pct}%"></i><span>${Math.max(0,e.hp)}/${e.maxHp}</span></div></div>`;}).join('');
  const newUids=b.newDrawUids||[];
  const cardsHTML=b.hand.map((h,i)=>{
    const actualCost=Math.max(0,(h.tempCost!==null?h.tempCost:CARDS[h.id].cost)-(b.costReduce||0));
    const isNew=newUids.includes(h.uid);
    return cardHTML(h.id,{disabled:b.energy<actualCost||h.entangled,entangled:h.entangled,costOverride:actualCost,cls:isNew?'card-enter':'',attr:`onpointerdown="onCardDown(event,${i})"`});
  }).join('');
  const energyCls=b.energy>b.maxEnergy?'energy over':'energy';
  const logs=b.log.slice(-3).map(l=>`<div style="color:${l.col}">${l.text}</div>`).join('');
  let itemsHTML='';for(let i=0;i<3;i++)itemsHTML+=itemSlotHTML(i);
  const buffs=getBattleBuffs();
  const buffsHTML=buffs.length?buffs.map(u=>`<div class="buff-item" style="border-color:${u.color}"><div class="bi" style="color:${u.color}">${u.icon}</div>${u.val?`<div class="bv" style="color:${u.color}">${u.val}</div>`:''}<div class="btip">${u.tip}</div></div>`).join(''):'<div style="font-size:8px;color:#3a3a54;text-align:center;width:100%">无</div>';
  const handCount=b.hand.length;
  return `<div class="screen"><div class="topbar"><span class="lbl">HP</span><div class="bar"><i class="hp" style="width:${Math.max(0,G.hp)/G.maxHp*100}%"></i><span>${Math.max(0,G.hp)}/${G.maxHp}</span></div><div class="lvbox">Lv.${G.level}</div><div class="coinbox">${spr('coin',2)} ${G.gold}</div></div><div class="battle-wrap"><div class="arena ${chapter.theme}"><div class="enemies">${enemiesHTML}</div><div class="playerrow" data-player-drop="1"><div class="sbox hero">${spr(charIcon,5)}</div><div style="display:flex;flex-direction:column;gap:3px"><div class="ename" style="font-size:10px">${CHARACTERS[G.character].name}</div>${b.shield>0?`<div class="shieldtag">🛡 护盾 ${b.shield}</div>`:`<div class="shieldtag dim">无护盾</div>`}${b.playerWeakness>0?`<div class="weaktag">💢 虚弱 ${b.playerWeakness}</div>`:''}${b.playerPoison>0?`<div class="poisontag">☠ 中毒 ${b.playerPoison}</div>`:''}${b.playerEntangle>0?`<div class="entangletag">🕸 缠绕 ${b.playerEntangle}</div>`:''}</div></div></div><div class="itembar"><div class="ilabel">道具</div>${itemsHTML}<div class="ilabel" style="margin-top:4px">全局增益</div><div class="buff-section">${buffsHTML}</div></div></div><div class="battlelog">${logs||'<div style="color:#3a3a54">— 暂无记录 —</div>'}</div><div class="handbar"><div class="hrow"><div class="${energyCls}">⚡ ${b.energy} / ${b.maxEnergy}</div><div class="piles"><span>手牌 <b style="color:${handCount>=HAND_LIMIT?'#ff8080':'#fff'}">${handCount}/${HAND_LIMIT}</b></span><span>牌库 <b>${b.drawPile.length}</b></span><span>弃牌 <b>${b.discardPile.length}</b></span></div><button class="btn" ${b.busy?'disabled':''} onclick="endTurn()">结束回合 ▶</button></div><div class="hand">${cardsHTML||'<div class="empty">— 没有手牌 —</div>'}</div></div></div>`;
}

function onCardDown(ev,idx){const b=G.battle;if(!b||b.busy||b.over)return;const h=b.hand[idx];if(!h)return;if(h.entangled)return;const actualCost=Math.max(0,(h.tempCost!==null?h.tempCost:CARDS[h.id].cost)-(b.costReduce||0));if(b.energy<actualCost)return;ev.preventDefault();const el=ev.currentTarget;const r=el.getBoundingClientRect();const clone=el.cloneNode(true);clone.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;pointer-events:none;z-index:9999;transform:scale(1.08) rotate(-4deg);transition:none;margin:0;`;document.body.appendChild(clone);el.style.opacity='0.25';drag={idx,hand:h,card:CARDS[h.id],el,clone,sx:ev.clientX,sy:ev.clientY};window.addEventListener('pointermove',onDragMove);window.addEventListener('pointerup',onDragUp);}
function onDragMove(ev){if(!drag)return;const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;const r=drag.el.getBoundingClientRect();drag.clone.style.left=(r.left+dx)+'px';drag.clone.style.top=(r.top+dy)+'px';document.querySelectorAll('.drop-hover').forEach(x=>x.classList.remove('drop-hover'));const t=dropTargetAt(ev.clientX,ev.clientY);if(t)t.classList.add('drop-hover');}
function dropTargetAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const e=el.closest('[data-enemy-idx]');if(e)return e;return el.closest('[data-player-drop]');}
function onDragUp(ev){window.removeEventListener('pointermove',onDragMove);window.removeEventListener('pointerup',onDragUp);document.querySelectorAll('.drop-hover').forEach(x=>x.classList.remove('drop-hover'));if(!drag)return;const d=drag;drag=null;const t=dropTargetAt(ev.clientX,ev.clientY);let enemyIdx=-1;if(t&&t.dataset.enemyIdx!==undefined)enemyIdx=+t.dataset.enemyIdx;/* 群攻牌是「自动锁定全体」，不需要拖到某个敌人身上 */
const needTarget=d.card.type==='debuff'||(d.card.type==='attack'&&!d.card.aoe);if(needTarget&&enemyIdx>=0){doPlayCard(d,enemyIdx);}else if(!needTarget){doPlayCard(d,-1);}else{const r=d.el.getBoundingClientRect();d.clone.style.transition='all 160ms ease-out';d.clone.style.left=r.left+'px';d.clone.style.top=r.top+'px';d.clone.style.transform='scale(1) rotate(0deg)';d.clone.style.opacity='0';d.el.style.opacity='1';setTimeout(()=>d.clone.remove(),180);}}
function countSameInHand(h,ignoreIdx){const b=G.battle;let count=0;for(let i=0;i<b.hand.length;i++){if(i===ignoreIdx)continue;if(b.hand[i].id===h.id)count++;}return count;}

/* ============================================================
   倒计时引擎 & 新机制分发（v2 扩展）
   ============================================================ */
function scheduleCountdown(id,card,b,tgt){
  if(!b.countdowns)b.countdowns=[];
  b.countdowns.push({id:id,name:card.name,fx:card.cdFx,val:card.cdVal,left:card.countdown,tgt:(tgt>=0?tgt:-1)});
  addLog(`⏳ 布置【${card.name}】——${card.countdown} 回合后发动`,'#c080ff');
}

function dmgEnemy(e,amount,label){
  if(!e||e.hp<=0)return 0;
  let d=Math.max(0,Math.round(amount));
  const ab=Math.min(e.shield,d);e.shield-=ab;e.hp-=(d-ab);
  if(label)addLog(`${label}：${e.name} 受到 ${d} 伤害`+(ab>0?`（盾${ab}）`:''),'#ff8080');
  return d;
}

function dmgAll(amount,label){
  const b=G.battle;if(!b)return;
  for(const e of b.enemies){if(e.hp>0)dmgEnemy(e,amount,label);}
}

function triggerCountdown(c,b){
  const alive=b.enemies.filter(e=>e.hp>0);
  const tgt=(c.tgt>=0&&b.enemies[c.tgt]&&b.enemies[c.tgt].hp>0)?b.enemies[c.tgt]:(alive[0]||null);
  const V=c.val||0;
  addLog(`⏳【${c.name}】发动！`,'#ffd75a');
  switch(c.fx){
    case 'aoeDmg': dmgAll(V,'倒计时爆发'); break;
    case 'drawHeal': {drawCards(4);const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+V);addLog(`抽4张，回复 ${G.hp-before} 生命`,'#7ce87c');break;}
    case 'aoePoison': {for(const e of b.enemies)if(e.hp>0)e.poison=(e.poison||0)+V;addLog(`全体敌人 +${V} 中毒`,'#a0e070');break;}
    case 'singleDmg': if(tgt)dmgEnemy(tgt,V,'倒计时爆炸'); break;
    case 'shield': b.shield+=V;addLog(`获得 ${V} 护盾`,'#80b0ff');break;
    case 'maxHp': G.maxHp+=V;G.hp=Math.min(G.maxHp,G.hp+V);addLog(`最大生命 +${V}，回复 ${V}`,'#7ce87c');break;
    case 'gold': G.gold+=V;addLog(`获得 ${V} 金币`,'#ffcc33');break;
    case 'chain': {const n=Math.max(1,alive.length);dmgAll(V*n,`连锁闪电（${n} 个目标）`);break;}
    case 'sacAoe': {const cost=Math.max(1,Math.round(V*0.15));G.hp=Math.max(1,G.hp-cost);addLog(`献祭 ${cost} 生命`,'#ff6060');dmgAll(V,'献祭之焰');break;}
    case 'freezeAll': {for(const e of b.enemies){if(e.hp<=0)continue;e.stunned=true;e.intent=null;e.weakness=(e.weakness||0)+V;}addLog(`全体眩晕并虚弱 ${V}`,'#8ab8ff');break;}
    case 'heal': {const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+V);addLog(`回复 ${G.hp-before} 生命`,'#7ce87c');break;}
    case 'reflectAtk': {for(const e of alive){const atk=Math.max(e.dmgMin||1,e.intent&&e.intent.type==='attack'?e.intent.value:0);dmgEnemy(e,atk*V,'反噬');}break;}
    case 'shieldBurst': {const d=(b.shield||0)*V;if(d<=0){addLog('没有护盾，爆发失败','#8a8a9a');break;}dmgAll(d,'护盾爆发');break;}
    case 'toxicBurst': {for(const e of alive){const p=e.poison||0;if(p>0){dmgEnemy(e,p*V,'剧毒爆发');e.poison=0;}}break;}
    case 'energy': b.energy+=V;addLog(`获得 ${V} 能量`,'#ffd75a');break;
    case 'doubleStrike': {for(let i=0;i<2;i++){const t=alive.length?b.enemies.filter(e=>e.hp>0):[];if(!t.length)break;dmgEnemy(t[rnd(t.length)],V,'双重打击');}break;}
    case 'siphon': {const t=alive[0];if(t){const d=dmgEnemy(t,V,'生命虹吸');const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+d);addLog(`回复 ${G.hp-before} 生命`,'#7ce87c');}break;}
    case 'stunAll': {for(const e of b.enemies){if(e.hp<=0)continue;e.stunned=true;e.intent=null;}addLog(`全体敌人无法行动`,'#8ab8ff');break;}
    case 'reshuffle': {b.drawPile=shuffle(b.drawPile.concat(b.discardPile));b.discardPile=[];addLog('弃牌堆已洗回抽牌堆','#8ab8ff');drawCards(V);break;}
    case 'weakenAll': {for(const e of b.enemies)if(e.hp>0)e.weakness=(e.weakness||0)+V;addLog(`全体虚弱 ${V}`,'#c080ff');break;}
    case 'thornGain': b.thorns=(b.thorns||0)+V;addLog(`获得 ${V} 层荆棘`,'#ffaa40');break;
    case 'atkUp': G.atkBuff=(G.atkBuff||0)+V;b.atkBuff=(b.atkBuff||0)+V;addLog(`本场攻击力 +${V}`,'#ffcc33');break;
    case 'executeHalf': {const t=alive.slice().sort((a,c)=>c.hp-a.hp)[0];if(t){const d=Math.max(1,Math.floor(t.hp/2));dmgEnemy(t,d,'天罚');}break;}
    case 'rebirth': b.rebirth=true;b.rebirthUsed=false;addLog('获得一次重生机会','#ffcc33');break;
    case 'randomDmg': {const t=alive.length?alive[rnd(alive.length)]:null;if(t){const lo=Math.round(V/4),d=lo+rnd(V-lo+1);dmgEnemy(t,d,'赌徒之骰');}break;}
    case 'drawMany': drawCards(V);addLog(`抽 ${V} 张牌`,'#8ab8ff');break;
    case 'holyHeal': {const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+V);b.playerPoison=0;b.playerWeakness=0;b.playerEntangle=0;b.hand.forEach(h=>h.entangled=false);addLog(`回复 ${G.hp-before} 生命，负面全清`,'#7ce87c');break;}
    default: addLog('倒计时效果未定义','#ff6060');break;
  }
  checkDeaths();
}


/* ===== 减倒计时牌效果 ===== */
function applySpecial2(card,b,idx,rect){
  const k=card.special2;if(!k)return false;
  const cds=b.countdowns||[];
  const log=(t,c)=>addLog(t,c||'#c080ff');
  const reduce=(n)=>{let hit=0;for(const c of cds){c.left=Math.max(1,c.left-n);hit++;}return hit;};
  switch(k){
    case 'hurry': {const n=reduce(1);log(n?`催促：${n} 个倒计时 -1`:'没有倒计时牌','#c080ff');break;}
    case 'timeLoop': {const n=reduce(2);log(n?`时间回环：${n} 个倒计时 -2`:'没有倒计时牌','#c080ff');break;}
    case 'warp': {const n=reduce(2);drawCards(2);log(n?`时空扭曲：${n} 个倒计时 -2，抽 2 张`:'抽 2 张','#c080ff');break;}
    case 'warp2': {const n=reduce(3);drawCards(2);log(n?`时空扭曲+：${n} 个倒计时 -3，抽 2 张`:'抽 2 张','#c080ff');break;}
    case 'hourglass': {const n=reduce(1);b.shield+=8;log(n?`沙漏：${n} 个倒计时 -1，8 护盾`:'8 护盾','#80b0ff');break;}
    case 'hourglass2': {const n=reduce(1);b.shield+=14;log(n?`沙漏+：${n} 个倒计时 -1，14 护盾`:'14 护盾','#80b0ff');break;}
    case 'cdEcho': {const n=cds.length;b.shield+=n*3;log(`倒计时回响：${n} 个倒计时 → ${n*3} 护盾`,'#80b0ff');break;}
    case 'cdEcho2': {const n=cds.length;b.shield+=n*5;log(`倒计时回响+：${n} 个倒计时 → ${n*5} 护盾`,'#80b0ff');break;}
    case 'rushGamble': {const n=reduce(3);G.hp=Math.max(1,G.hp-5);log(n?`孤注一掷：${n} 个倒计时 -3，失去 5 生命`:'失去 5 生命','#e04060');break;}
    case 'rushGamble2': {const n=reduce(4);G.hp=Math.max(1,G.hp-3);log(n?`孤注一掷+：${n} 个倒计时 -4，失去 3 生命`:'失去 3 生命','#e04060');break;}
    case 'clockHeart': {const n=reduce(1);b.energy+=1;log(n?`钟表心：${n} 个倒计时 -1，+1 能量`:'+1 能量','#ffd75a');break;}
    case 'clockHeart2': {const n=reduce(1);b.energy+=2;log(n?`钟表心+：${n} 个倒计时 -1，+2 能量`:'+2 能量','#ffd75a');break;}
    case 'ignite': case 'ignite2': {
      if(!cds.length){log('没有倒计时牌可引燃','#8a8a9a');break;}
      const mult=k==='ignite2'?2:1.5;
      const t=cds.slice().sort((a,x)=>a.left-x.left)[0];
      const one={...t,val:Math.round(t.val*mult)};
      b.countdowns=cds.filter(c=>c!==t);
      log(`引燃【${t.name}】！效果 ×${mult}`,'#ff9a3a');
      triggerCountdown(one,b);
      break;
    }
    case 'finalCount': {
      if(!cds.length){log('没有倒计时牌','#8a8a9a');break;}
      const all=cds.slice();
      b.countdowns=[];
      log(`终末倒数：${all.length} 个倒计时同时发动！`,'#ff6060');
      for(const c of all){triggerCountdown(c,b);if(b.over)break;checkDeaths();if(!b.enemies.length)break;}
      break;
    }
    default: return false;
  }
  return true;
}

/* 其他机制卡（sp2）分发 */
function applySp2(card,b,idx,rect){
  const key=card.sp2;if(!key)return false;
  const log=(t,c)=>addLog(t,c||'#8ab8ff');
  const alive=b.enemies.filter(e=>e.hp>0);
  const tgt=(idx>=0&&b.enemies[idx]&&b.enemies[idx].hp>0)?b.enemies[idx]:(alive[0]||null);
  switch(key){
    case 'coinToss': case 'coinToss2': {const div=key==='coinToss2'?3:5;const cap=key==='coinToss2'?45:30;const d=Math.min(cap,Math.floor(G.gold/div));if(tgt)dmgEnemy(tgt,d,'硬币投掷');else log('没有目标','#8a8a9a');break;}
    case 'discardOne': {if(b.hand.length){const k=rnd(b.hand.length);const g=b.hand.splice(k,1)[0];b.discardPile.push(g.id);log(`弃掉【${CARDS[g.id].name}】`);}break;}
    case 'handMaster': case 'handMaster2': {const d=key==='handMaster2'?18:12;if(b.hand.length>=5){dmgAll(d,'手牌大师');}else log('手牌不足 5 张，未触发','#8a8a9a');break;}
    case 'emptyBurst': case 'emptyBurst2': {const d=key==='emptyBurst2'?38:25;if(b.hand.length===0&&tgt)dmgEnemy(tgt,d,'空手爆发');else log('手牌不为空，未触发','#8a8a9a');break;}
    case 'thorn3': b.thorns=(b.thorns||0)+3;log('获得 3 层荆棘');break;
    case 'thorn5': b.thorns=(b.thorns||0)+5;log('获得 5 层荆棘');break;
    case 'energy1': b.energy+=1;log('+1 能量');break;
    case 'energy2': b.energy+=2;log('+2 能量');break;
    case 'energy3': b.energy+=3;log('+3 能量');break;
    case 'cleanseOne': {if(b.playerPoison>0){b.playerPoison=0;log('清除中毒');}else if(b.playerWeakness>0){b.playerWeakness=0;log('清除虚弱');}else if(b.playerEntangle>0){b.playerEntangle=0;log('清除缠绕');}else log('没有可清除的负面','#8a8a9a');b.shield+=8;log('获得 8 护盾');break;}
    case 'cleanseAll8': {b.playerPoison=0;b.playerWeakness=0;b.playerEntangle=0;b.hand.forEach(h=>h.entangled=false);b.shield+=12;log('清空负面，获得 12 护盾');break;}
    case 'toxinExtract': case 'toxinExtract2': {if(!tgt){log('没有目标','#8a8a9a');break;}const per=key==='toxinExtract2'?3:2;const p=tgt.poison||0;if(p<=0){log('目标没有中毒','#8a8a9a');break;}tgt.poison=0;b.shield+=p*per;log(`吸取 ${p} 层中毒，获得 ${p*per} 护盾`);break;}
    case 'energyBlast': case 'energyBlast2': {const per=key==='energyBlast2'?9:6;const n=b.energy;b.energy=0;if(n<=0){log('没有能量','#8a8a9a');break;}if(tgt)dmgEnemy(tgt,n*per,'能量爆发');break;}
    case 'soulHarvest': case 'soulHarvest2': {if(!tgt){log('没有目标','#8a8a9a');break;}const th=key==='soulHarvest2'?0.45:0.30;if(tgt.boss){log('对首领无效','#8a8a9a');break;}if(tgt.hp<tgt.maxHp*th){log(`灵魂收割！${tgt.name} 被直接斩杀`,'#c080ff');tgt.hp=0;}else log('目标生命过高，未触发','#8a8a9a');break;}
    case 'mirrorTwin': {if(!b.hand.length){log('手牌为空','#8a8a9a');break;}const src=b.hand[rnd(b.hand.length)];if(b.hand.length<HAND_LIMIT){const nh={uid:uid++,id:src.id,tempCost:0,entangled:false};b.hand.push(nh);b.newDrawUids.push(nh.uid);log(`复制【${CARDS[src.id].name}】（0费）`,'#c080ff');}else log('手牌已满','#8a8a9a');break;}
    case 'atkUp1': G.atkBuff=(G.atkBuff||0)+1;b.atkBuff=(b.atkBuff||0)+1;log('本场攻击 +1','#ffcc33');break;
    case 'atkUp2': G.atkBuff=(G.atkBuff||0)+2;b.atkBuff=(b.atkBuff||0)+2;log('本场攻击 +2','#ffcc33');break;
    case 'nextDraw1': b.drawBonusNext=(b.drawBonusNext||0)+1;log('下回合多抽 1 张');break;
    case 'nextDraw2': b.drawBonusNext=(b.drawBonusNext||0)+2;log('下回合多抽 2 张');break;
    case 'shieldNext15': b.shieldNextTurn=(b.shieldNextTurn||0)+15;log('下回合开始再获 15 护盾');break;
    case 'shieldNext22': b.shieldNextTurn=(b.shieldNextTurn||0)+22;log('下回合开始再获 22 护盾');break;
    case 'flameBurn': case 'flameBurn2': {const d=key==='flameBurn2'?12:8,po=key==='flameBurn2'?6:4;if(!tgt){log('没有目标','#8a8a9a');break;}dmgEnemy(tgt,d,'烈焰灼烧');tgt.poison=(tgt.poison||0)+po;log(`施加 ${po} 中毒`,'#a0e070');break;}
    case 'thunder': case 'thunder2': {const base=key==='thunder2'?18:12;if(!tgt){log('没有目标','#8a8a9a');break;}const hadShield=(tgt.shield||0)>0;dmgEnemy(tgt,hadShield?base*2:base,'雷霆一击');if(hadShield)log('目标有护盾，伤害翻倍','#ffcc33');break;}
    case 'thornBind': case 'thornBind2': {const v=key==='thornBind2'?6:4;if(!tgt){log('没有目标','#8a8a9a');break;}if(tgt.intent&&tgt.intent.type==='attack')tgt.intent.value=Math.max(0,tgt.intent.value-v);tgt.poison=(tgt.poison||0)+v;log(`虚弱 ${v} 并施加 ${v} 中毒`,'#c080ff');break;}
    case 'energyShield': case 'energyShield2': {const per=key==='energyShield2'?5:3;const n=b.energy;b.shield+=n*per;log(`${n} 能量 → ${n*per} 护盾`);break;}
    case 'finalBlow': case 'finalBlow2': {const missing=G.maxHp-G.hp;const d=key==='finalBlow2'?Math.floor(missing/1.5):Math.floor(missing/2);if(!tgt){log('没有目标','#8a8a9a');break;}dmgEnemy(tgt,Math.max(1,d),'终末一击');break;}
    case 'zeroOne': {const cands=b.hand.filter(h=>h.tempCost!==0);if(!cands.length){log('没有可降费的牌','#8a8a9a');break;}const pickH=cands[rnd(cands.length)];pickH.tempCost=0;log(`【${CARDS[pickH.id].name}】变为 0 费`,'#ffd75a');break;}
    case 'calmMind': case 'calmMind2': {const heal=key==='calmMind2'?9:5;b.playerPoison=0;b.playerWeakness=0;b.playerEntangle=0;b.hand.forEach(h=>h.entangled=false);const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+heal);log(`清空负面，回复 ${G.hp-before} 生命`,'#7ce87c');break;}
    case 'recoil': case 'recoil2': {const div=key==='recoil2'?2:3;const d=Math.floor((b.dmgTaken||0)/div);if(!tgt){log('没有目标','#8a8a9a');break;}dmgEnemy(tgt,Math.max(1,d),`反作用力（已受伤 ${b.dmgTaken||0}）`);break;}

    case 'poisonEdge': case 'poisonEdge2': {const d=key==='poisonEdge2'?8:5,po=key==='poisonEdge2'?8:5;if(!tgt){log('没有目标','#8a8a9a');break;}dmgEnemy(tgt,d,'毒刃');tgt.poison=(tgt.poison||0)+po;log(`施加 ${po} 中毒`,'#a0e070');break;}
    case 'shieldBash': case 'shieldBash2': {const d=key==='shieldBash2'?(b.shield+10):Math.floor(b.shield/2)+5;if(!tgt){log('没有目标','#8a8a9a');break;}dmgEnemy(tgt,Math.max(1,d),'护盾猛击');break;}
    case 'swiftSlash': case 'swiftSlash2': {const mul=key==='swiftSlash2'?3:2;const d=Math.max(1,b.hand.length*mul);dmgAll(d,'疾风连斩');log(`手牌 ${b.hand.length} 张 → 每目标 ${d} 伤害`);break;}
    case 'heal8': {const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+8);log(`回复 ${G.hp-before} 生命`,'#7ce87c');break;}
    case 'heal14': {const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+14);log(`回复 ${G.hp-before} 生命`,'#7ce87c');break;}
    default: return false;
  }
  return true;
}

    case 'acidTouch2':{if(!e)break;const sh=e.shield||0;e.shield=0;if(e.intent&&e.intent.type==='attack')e.intent.value=Math.max(0,e.intent.value-3);e.poison=(e.poison||0)+2;log(`腐蚀之触+：摧毁 ${sh} 护盾，削弱 3，+2 毒`);break;}
    case 'toxicCoat':{b.venomCoat=(b.venomCoat||0)+2;log('剧毒涂层：本回合攻击附加 +2 中毒');break;}

    case 'soulSip':{if(!e)break;const take=Math.min(3,e.poison||0);if(take<=0){log('以毒养身：目标没有中毒','#8a8a9a');break;}e.poison-=take;const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+take*2);log(`以毒养身：消耗 ${take} 层，回复 ${G.hp-before} 生命`,'#7ce87c');break;}

    case 'sporeCloud':{const mul=b.enemies.filter(x=>x.hp>0).length>=3;poisonAll(mul?5:3);log(`孢子云：全体 +${mul?5:3} 中毒`);break;}
    case 'sporeCloud2':{const mul=b.enemies.filter(x=>x.hp>0).length>=3;poisonAll(mul?7:4);log(`孢子云+：全体 +${mul?7:4} 中毒`);break;}

    case 'venomResonance':{const total=b.enemies.reduce((s,x)=>s+Math.max(0,x.poison||0),0);if(total<=0){log('毒之共鸣：全场没有中毒','#8a8a9a');break;}const alive=b.enemies.filter(x=>x.hp>0);if(!alive.length)break;const t=pick(alive);const ab=Math.min(t.shield,total);t.shield-=ab;t.hp-=(total-ab);log(`毒之共鸣：${t.name} 受到 ${total} 伤害`,'#ff8080');break;}

    case 'battery2':{b.maxEnergy=(b.maxEnergy||3)+2;log(`电池+：本场最大能量 +2（现 ${b.maxEnergy}）`,'#ffd75a');break;}
    case 'overShield':{const n=b.energy;b.energy=0;b.shield+=n*4;log(`过载护盾：${n} 能量 → ${n*4} 护盾`,'#80b0ff');break;}
    case 'overShield2':{const n2=b.energy;b.energy=0;b.shield+=n2*6;log(`过载护盾+：${n2} 能量 → ${n2*6} 护盾`,'#80b0ff');break;}
    case 'echoPower':{b.echoEnergy=(b.echoEnergy||0)+3;log('灵力回响：本回合接下来 3 张牌各 +1 能量','#c080ff');break;}

    case 'chargeStrike':{b.energy+=2;log('充能打击：+2 能量','#ffd75a');break;}
    case 'chargeStrike2':{b.energy+=3;log('充能打击+：+3 能量','#ffd75a');break;}
    case 'convert':{if(b.hand.length<=0){log('能量转换：没有手牌可弃','#8a8a9a');break;}const k=Math.floor(Math.random()*b.hand.length);const gone=b.hand.splice(k,1)[0];b.discardPile.push(gone.id);b.energy+=2;drawCards(1);log(`能量转换：弃【${CARDS[gone.id].name}】，+2 能量，抽 1 张`,'#ffd75a');break;}
    case 'convert2':{if(b.hand.length<=0){log('能量转换+：没有手牌可弃','#8a8a9a');break;}const k2=Math.floor(Math.random()*b.hand.length);const gone2=b.hand.splice(k2,1)[0];b.discardPile.push(gone2.id);b.energy+=3;drawCards(2);log(`能量转换+：弃【${CARDS[gone2.id].name}】，+3 能量，抽 2 张`,'#ffd75a');break;}

    case 'freeFrenzy':{for(const h2 of b.hand)h2.tempCost=0;log('零费狂热：本回合手牌全部变为 0 费','#ffd75a');break;}
    case 'freeFrenzy2':{for(const h3 of b.hand)h3.tempCost=0;drawCards(2);log('零费狂热+：手牌全变 0 费，抽 2 张','#ffd75a');break;}
